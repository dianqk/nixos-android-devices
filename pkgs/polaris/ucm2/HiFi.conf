# Polaris: Q6ASM MM1 -> QUAT MI2S -> TAS2559/2560; MM2 <- WCD9340 ADC3/ADC1.
SectionVerb {
    EnableSequence [
        # PipeWire probes every PCM after selecting the verb but before it
        # enables individual UCM devices. DPCM frontends cannot open until
        # their complete mixer routes exist, so establish both routes here.
        cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
        cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
        # Both AIF1 capture inputs must be routed: the q6 SLIMBUS_0_TX
        # backend is 2-channel, and with only one input the DPCM stream stalls
        # after half of the frames (measured on polaris: rms=0, 199678 frames
        # instead of 380158). DEC0/DEC3 with AMIC MUX0/MUX3 are the paths that
        # actually carry audio on mainline; the Android-era DEC7/DEC8 pairing
        # leaves the stream silent.
        cset "name='ADC MUX0' AMIC"
        cset "name='AMIC MUX0' ADC1"
        cset "name='ADC MUX3' AMIC"
        cset "name='AMIC MUX3' ADC3"
        cset "name='CDC_IF TX0 MUX' DEC0"
        cset "name='CDC_IF TX3 MUX' DEC3"
        cset "name='AIF1_CAP Mixer SLIM TX0' 1"
        cset "name='AIF1_CAP Mixer SLIM TX3' 1"
    ]
    DisableSequence [
        cset "name='AIF1_CAP Mixer SLIM TX3' 0"
        cset "name='AIF1_CAP Mixer SLIM TX0' 0"
        cset "name='CDC_IF TX3 MUX' ZERO"
        cset "name='CDC_IF TX0 MUX' ZERO"
        cset "name='AMIC MUX3' ZERO"
        cset "name='AMIC MUX0' ZERO"
        # ADC MUX has no ZERO item; DMIC is its inactive/default selection.
        cset "name='ADC MUX3' DMIC"
        cset "name='ADC MUX0' DMIC"
        cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
        cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
    ]
    Value { TQ "HiFi" }
}

SectionDevice."Speaker" {
    Comment "Built-in speakers"
    EnableSequence [
        # Pinned SDM845 driver uses 48 kHz, 16-bit stereo, 1.536 MHz BCLK.
        # Firmware preset 4 is the matching speaker preset; Android preset 14
        # uses the other PLL (3.072 MHz BCLK). Never copy preset 14 verbatim.
        cset "name='Configuration' 4"
        # TI defines these fields as 0..15 dB. Use their full supported gain;
        # PipeWire remains the user-facing volume control.
        cset "name='TAS2559 DAC Playback Volume' 15"
        cset "name='TAS2560 DAC Playback Volume' 15"
    ]
    Value {
        PlaybackPCM "hw:${CardId},0"
        PlaybackChannels 2
        PlaybackRate 48000
        PlaybackPriority 100
    }
}

SectionDevice."Mic" {
    Comment "Built-in microphones (ADC3 and ADC1)"
    EnableSequence [
        # The wcd934x kcontrols are named 'ADC1'/'ADC3' (range 0..20); the
        # Android mixer XML names ('ADC1 Volume', 'DEC7 Volume', ...) do not
        # exist on mainline and those csets silently do nothing.
        cset "name='ADC1' 15"
        cset "name='ADC3' 15"
    ]
    Value {
        CapturePCM "hw:${CardId},1"
        CaptureChannels 2
        CaptureRate 48000
        CapturePriority 100
    }
}
