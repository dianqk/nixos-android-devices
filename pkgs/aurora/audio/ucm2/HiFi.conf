# Speaker protection remains in the Cirrus DSP signal path.
SectionVerb {
    EnableSequence [
        cset "name='B AMP Enable Switch' 0"
        cset "name='T AMP Enable Switch' 0"
        cset "name='B PCM Source' Zero"
        cset "name='T PCM Source' Zero"
        cset "name='B DSP1 Firmware' Protection"
        cset "name='T DSP1 Firmware' Protection"
        # ACP probes the PCM after selecting the verb, before enabling Speaker.
        # Expose the backend while both amplifier outputs remain disabled.
        cset "name='SECONDARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"
    ]
    DisableSequence [
        cset "name='SECONDARY_TDM_RX_0 Audio Mixer MultiMedia1' 0"
    ]
    Value { TQ "HiFi" }
}

SectionDevice."Speaker" {
    Comment "Top and bottom speakers"
    EnableSequence [
        cset "name='B DSP1 Preload Switch' 1"
        cset "name='T DSP1 Preload Switch' 1"
        exec "@WAIT_SPEAKER_CONTROLS@ ${CardId}"
        # AURORA_SPEAKER_CALIBRATION
        # Apply board routing after firmware preload, before enabling the amps.
        cset "name='B Digital PCM Volume' 361"
        cset "name='T Digital PCM Volume' 361"
        # Preserve amplifier gain/ramp defaults from the accepted runtime.
        cset "name='B ASPRX1 Slot Position' 1"
        cset "name='T ASPRX1 Slot Position' 0"
        cset "name='B DSP RX1 Source' ASPRX1"
        cset "name='B DSP RX2 Source' ASPRX1"
        cset "name='T DSP RX1 Source' ASPRX1"
        cset "name='T DSP RX2 Source' ASPRX1"
        cset "name='B PCM Source' DSP"
        cset "name='T PCM Source' DSP"
        cset "name='B AMP Enable Switch' 1"
        cset "name='T AMP Enable Switch' 1"
    ]
    DisableSequence [
        cset "name='B AMP Enable Switch' 0"
        cset "name='T AMP Enable Switch' 0"
        cset "name='B PCM Source' Zero"
        cset "name='T PCM Source' Zero"
        cset "name='B DSP1 Preload Switch' 0"
        cset "name='T DSP1 Preload Switch' 0"
    ]
    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId},0"
        PlaybackChannels 2
    }
}
