# Xiaomi Poco F5 / Redmi Note 12 Turbo (marble): two AW88263S speaker
# amplifiers on tertiary TDM and the WCD9385 bottom microphone. Adapted
# from github.com/iLtanaka/marble-device-support 0156b22 (alsa/ucm2);
# the earpiece and voice-call routes are not included.
# Control prefixes follow the physical position: "Speaker Top" is the
# amplifier at 0x34 (TDM slot 0, top/earpiece-end speaker; also the
# earpiece when gpio52 is active), "Speaker Bottom" the one at 0x35
# (slot 1, bottom speaker).

SectionVerb {
	Value {
		TQ "HiFi"
	}
	EnableSequence [
		cset "name='TERTIARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"
		# Route the capture front end in the verb: clients open the
		# capture PCM to probe it before enabling the Mic device, and the
		# open fails (EINVAL) while the front end is unrouted.
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='Speaker Top Profile Set' Music"
		cset "name='Speaker Bottom Profile Set' Music"
		# Amplifier volume 349 of 360 (0.25 dB steps, -2.75 dB): the
		# Music profile's own SYSCTRL2 volume, which stock Android keeps
		# while playing (its volume steps are applied before the
		# amplifier). No host speaker protection: set the level with the
		# PipeWire sink volume.
		cset "name='Speaker Top PCM Playback Volume' 349"
		cset "name='Speaker Bottom PCM Playback Volume' 349"
	]
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Bottom microphone"

	# WCD9385 AMIC1 -> ADC1 -> SoundWire TX -> TX macro DEC0 -> TX_CODEC_DMA_TX_3
	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='DEC0 MODE' ADC_DEFAULT"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 10"
		cset "name='TX0 MODE' ADC_NORMAL"
	]

	DisableSequence [
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='TX0 MODE' ADC_INVALID"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
	}
}
