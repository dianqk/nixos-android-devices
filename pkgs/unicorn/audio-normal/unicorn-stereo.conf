# Optional named PCM only. This file does not select a UCM verb/device, change
# mixer controls, enable SPK/Preload, or replace the system default PCM.
# The explicit matrix is required: channels beyond L/R are discarded, and no
# input contributes to the third (independent ultrasound) transport channel.
pcm.unicorn_stereo {
    type plug
    slave {
        # The route plugin performs explicit channel mapping even when ACP
        # opens with SND_PCM_NO_AUTO_CHANNELS. A plug-only matrix cannot.
        pcm {
            type route
            slave {
                pcm "hw:CARD=Xiaomi12SPro,DEV=4"
                format S16_LE
                channels 3
            }
            ttable {
                0.0 1
                1.1 1
            }
        }
        format S16_LE
        rate 96000
        channels 2
    }
    rate_converter "linear"
    hint {
        show on
        description "Unicorn stereo transport (96 kHz; third channel zero)"
    }
}
