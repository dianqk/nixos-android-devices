# One physical ADC1 microphone; the DSP transports two copies at 48 kHz.
# Select channel 0 rather than summing the copies or advertising two microphones.
pcm.unicorn_mic {
    type plug
    slave {
        # The route plugin performs explicit channel mapping even when ACP
        # opens with SND_PCM_NO_AUTO_CHANNELS. A plug-only matrix cannot.
        pcm {
            type route
            slave {
                pcm "hw:CARD=Xiaomi12SPro,DEV=2"
                format S16_LE
                channels 2
            }
            ttable {
                0.0 1
            }
        }
        format S16_LE
        rate 48000
        channels 1
    }
    rate_converter "linear"
    hint {
        show on
        ioid "Input"
        description "Unicorn ADC1 microphone (mono)"
    }
}
