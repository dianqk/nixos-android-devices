# Built from Unicorn's own controls and the tested normal DAPM path. No GPIO,
# direct register/mailbox, coefficient, firmware search-path, or private input
# operations belong in this profile. Data preparation is a separate service.

SectionVerb {
    EnableSequence [
        cset "name='T SPK Switch' off"
        cset "name='B SPK Switch' off"
        cset "name='T DSP1 Preload Switch' off"
        cset "name='B DSP1 Preload Switch' off"
        # ACP probes the PCMs after selecting the verb, before enabling a
        # device. DPCM needs the frontend/backend links already connected.
        cset "name='TERTIARY_TDM_RX_0 Audio Mixer MultiMedia5' on"
        cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' on,on"
    ]
    DisableSequence [
        cset "name='T SPK Switch' off"
        cset "name='B SPK Switch' off"
        cset "name='TERTIARY_TDM_RX_0 Audio Mixer MultiMedia5' off"
        cset "name='T DSP1 Preload Switch' off"
        cset "name='B DSP1 Preload Switch' off"
        cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' off,off"
        cset "name='TX_AIF1_CAP Mixer DEC0' off"
        cset "name='TX_AIF1_CAP Mixer DEC1' off"
        cset "name='TX_AIF1_CAP Mixer DEC2' off"
        cset "name='TX SMIC MUX0' ZERO"
        cset "name='TX SMIC MUX1' ZERO"
        cset "name='TX DEC0 MUX' MSM_DMIC"
        cset "name='TX DEC1 MUX' MSM_DMIC"
        cset "name='ADC1 Switch' off"
        cset "name='ADC1_MIXER Switch' off"
        cset "name='TX1 MODE' ADC_INVALID"
        cset "name='ADC1 Volume' 0"
    ]
    Value {
        TQ "HiFi"
    }
}

SectionDevice."Mic" {
    Comment "ADC1 microphone (one physical input)"
    EnableSequence [
        cset "name='ADC1 Volume' 8"
        cset "name='TX1 MODE' ADC_LP"
        cset "name='ADC1_MIXER Switch' on"
        cset "name='ADC1 Switch' on"
        cset "name='TX DEC0 MUX' SWR_MIC"
        cset "name='TX SMIC MUX0' SWR_MIC0"
        cset "name='TX DEC1 MUX' SWR_MIC"
        cset "name='TX SMIC MUX1' SWR_MIC0"
        cset "name='TX_AIF1_CAP Mixer DEC2' off"
        cset "name='TX_AIF1_CAP Mixer DEC0' on"
        cset "name='TX_AIF1_CAP Mixer DEC1' on"
    ]
    DisableSequence [
        cset "name='TX_AIF1_CAP Mixer DEC0' off"
        cset "name='TX_AIF1_CAP Mixer DEC1' off"
        cset "name='TX_AIF1_CAP Mixer DEC2' off"
        cset "name='TX SMIC MUX0' ZERO"
        cset "name='TX SMIC MUX1' ZERO"
        cset "name='TX DEC0 MUX' MSM_DMIC"
        cset "name='TX DEC1 MUX' MSM_DMIC"
        cset "name='ADC1 Switch' off"
        cset "name='ADC1_MIXER Switch' off"
        cset "name='TX1 MODE' ADC_INVALID"
        cset "name='ADC1 Volume' 0"
    ]
    Value {
        CapturePCM "unicorn_mic"
        CaptureCTL "hw:Xiaomi12SPro"
        CaptureChannels 1
        CaptureRate 48000
        CapturePriority 100
    }
}

SectionDevice."Speaker" {
    Comment "Protected stereo speakers"
    EnableSequence [
        cset "name='T DSP1 Firmware' Protection"
        cset "name='B DSP1 Firmware' Protection"
        # 817 is 0 dB on the driver's -102..+12 dB scale (0 is mute).
        # Both amplifiers were acoustically verified with OEM protection.
        # PipeWire applies the user's volume in software to both channels.
        cset "name='T Digital PCM Volume' 817"
        cset "name='B Digital PCM Volume' 817"
        cset "name='T Analog PCM Volume' 0"
        cset "name='B Analog PCM Volume' 0"
        cset "name='T PCM Source' DSP"
        cset "name='B PCM Source' DSP"
        cset "name='T DSP RX1 Source' ASPRX1"
        cset "name='T DSP RX2 Source' ASPRX2"
        cset "name='B DSP RX1 Source' ASPRX1"
        cset "name='B DSP RX2 Source' ASPRX1"
        cset "name='T SPK Switch' on"
        cset "name='B SPK Switch' on"
    ]
    DisableSequence [
        cset "name='T SPK Switch' off"
        cset "name='B SPK Switch' off"
        cset "name='T Digital PCM Volume' 0"
        cset "name='B Digital PCM Volume' 0"
        cset "name='T DSP1 Preload Switch' off"
        cset "name='B DSP1 Preload Switch' off"
    ]
    Value {
        PlaybackPCM "unicorn_stereo"
        PlaybackCTL "hw:Xiaomi12SPro"
        PlaybackChannels 2
        PlaybackRate 96000
        PlaybackPriority 100
    }
}
