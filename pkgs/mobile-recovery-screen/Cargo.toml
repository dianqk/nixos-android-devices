[package]
name = "mobile-recovery-screen"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
device-polaris = []
device-asphalt = []
device-clover = []
device-sheng = []
device-aurora = []
refresh-panel = []
backlight-control = []
ab-partitions = []

host-key = ["dep:anyhow", "dep:serde", "dep:serde_json"]

recovery-daemon = ["dep:anyhow", "dep:serde", "dep:serde_json", "dep:sha2", "dep:tar", "dep:flate2"]

[dependencies]
libc = "0.2"
anyhow = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }

[[bin]]
name = "recovery"
path = "src/bin/recovery.rs"
required-features = ["recovery-daemon"]

[[bin]]
name = "mobile-recovery-daemon"
path = "src/bin/mobile-recovery-daemon.rs"
required-features = ["recovery-daemon"]

[[bin]]
name = "mobile-recovery-host-key"
path = "src/bin/mobile-recovery-host-key.rs"
required-features = ["host-key"]
