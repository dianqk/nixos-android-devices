<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>启动选择</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>启动选择</h1><p>打开页面和刷新只读取状态，不会重启。请确保已保存工作并保留独立恢复方式。</p>
<p id="notice" role="status">正在准备只读状态…</p>
<button id="refresh">刷新状态</button><pre id="status" aria-live="polite"></pre>
<button id="nixos" disabled>切换到 NixOS</button><button id="android" disabled>切换到 Android</button>
<p>点击切换即授权原生工具验证、提交偏好并请求普通重启；不弹出第二次确认。重启请求不代表实际启动成功。</p>
</main><script type="module" src="app.mjs"></script></body></html>
