# Polaris: Q6ASM MM1 -> QUAT MI2S -> TAS2559/2560; MM2 <- WCD9340 ADC3/ADC1.
#
# Adapted from the stock Polaris HiFi with two fixes required for the
# configuration to load through conf.d at all:
#   - ${CardId} is not defined when a card configuration is imported via
#     conf.d, so the PCM is hardcoded to hw:0 (this card is always card 0:
#     it is the only ALSA card the device exposes).
#   - The stock conf.d entry ships under the card *short* name, which
#     alsa-lib never probes (see audio.nix for the lookup rules).
SectionVerb {
    EnableSequence [
        cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
        cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
        cset "name='ADC MUX7' AMIC"
        cset "name='AMIC MUX7' ADC3"
        cset "name='ADC MUX8' AMIC"
        cset "name='AMIC MUX8' ADC1"
        cset "name='CDC_IF TX7 MUX' DEC7"
        cset "name='CDC_IF TX8 MUX' DEC8"
        cset "name='AIF1_CAP Mixer SLIM TX7' 1"
        cset "name='AIF1_CAP Mixer SLIM TX8' 1"
    ]
    DisableSequence [
        cset "name='AIF1_CAP Mixer SLIM TX8' 0"
        cset "name='AIF1_CAP Mixer SLIM TX7' 0"
        cset "name='CDC_IF TX8 MUX' ZERO"
        cset "name='CDC_IF TX7 MUX' ZERO"
        cset "name='AMIC MUX8' ZERO"
        cset "name='AMIC MUX7' ZERO"
        # ADC MUX has no ZERO item; DMIC is its inactive/default selection.
        cset "name='ADC MUX8' DMIC"
        cset "name='ADC MUX7' DMIC"
        cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
        cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
    ]
    Value { TQ "HiFi" }
}

SectionDevice."Speaker" {
    Comment "Built-in speakers"
    EnableSequence [
        # Pinned SDM845 driver uses 48 kHz, 16-bit stereo, 1.536 MHz BCLK.
        # Firmware preset 4 is the matching speaker preset; Android preset 14
        # uses the other PLL (3.072 MHz BCLK). Never copy preset 14 verbatim.
        cset "name='Configuration' 4"
        # TI defines these fields as 0..15 dB. Use their full supported gain;
        # PipeWire remains the user-facing volume control.
        cset "name='TAS2559 DAC Playback Volume' 15"
        cset "name='TAS2560 DAC Playback Volume' 15"
    ]
    Value {
        PlaybackPCM "hw:0,0"
        PlaybackChannels 2
        PlaybackRate 48000
        PlaybackPriority 100
    }
}

SectionDevice."Mic" {
    Comment "Built-in microphones (ADC3 and ADC1)"
    EnableSequence [
        cset "name='ADC3 Volume' 5"
        cset "name='ADC1 Volume' 5"
        cset "name='DEC7 Volume' 80"
        cset "name='DEC8 Volume' 80"
    ]
    Value {
        CapturePCM "hw:0,1"
        CaptureChannels 2
        CaptureRate 48000
        CapturePriority 100
    }
}
