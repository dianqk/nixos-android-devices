# Sheng support status; see docs/status/items.toml for the items and the
# meaning of each status. Regenerate the pages with tools/status-pages.py.

[device]
name = "Xiaomi Pad 6S Pro 12.4 (sheng)"
name_zh = "小米平板 6S Pro 12.4（sheng）"
soc = "Qualcomm SM8550"
kernel = "Nixpkgs Linux 7.3-rc5 with Sheng patches"
kernel_zh = "Nixpkgs Linux 7.3-rc5 及 Sheng 补丁"
updated = "2026-10-30"

[items.boot-chain]
status = "Works"
note = "ABL → U-Boot (`boot_b`) → systemd-boot on FAT `linux-boot` → Linux, root on ext4 `linux`; boot without a USB host attached is unverified."
note_zh = "ABL → U-Boot（`boot_b`）→ FAT `linux-boot` 上的 systemd-boot → Linux，根分区为 ext4 `linux`；未连接 USB 主机时的启动未验证。"

[items.generations]
status = "Partial"
note = "New generations boot by default without rewriting U-Boot; older generations were only selected during bring-up, not in a recorded rollback."
note_zh = "新代际默认启动且无需重写 U-Boot；旧代际仅在适配期间被选择启动，尚无记录的回滚测试。"

[items.ram-recovery]
status = "Works"
note = "ABL boots `recovery_b` independently; USB SSH, offline system deployment and recovery self-update work."
note_zh = "ABL 可独立启动 `recovery_b`；USB SSH、离线系统部署与 recovery 自更新均可用。"

[items.first-install]
status = "Untested"
note = "The system was deployed from recovery onto manually prepared partitions; `prepare-install` and `install-initial` are untested."
note_zh = "系统由 recovery 部署到手动准备的分区；`prepare-install` 与 `install-initial` 未测试。"

[items.reboot-modes]
status = "Works"
note = "Reboot arguments `bootloader` and `recovery` reach fastboot and RAM recovery. The EFI menu entries are untested."
note_zh = "重启参数 `bootloader` 与 `recovery` 可进入 fastboot 和 RAM recovery。EFI 菜单项未测试。"

[items.internal-storage]
status = "Works"
note = "UFS; separate `linux` and `linux-boot` partitions sit beside Android, which stays intact."
note_zh = "UFS；独立的 `linux` 与 `linux-boot` 分区与 Android 并存，Android 保持不变。"

[items.removable-storage]
status = "N/A"
note = "The tablet has no microSD slot."
note_zh = "该平板没有 microSD 卡槽。"

[items.display]
status = "Works"
note = "Dual-DSI NT36532E panel at 3048×2032, 120 Hz, taken over directly from U-Boot."
note_zh = "双 DSI NT36532E 面板以 3048×2032、120 Hz 显示，直接接管 U-Boot 画面。"
verified = "2026-10-06"

[items.backlight]
status = "Untested"
note = "Software sets and reads brightness; brightness changes and screen off and on are not yet verified on the panel."
note_zh = "软件可设置并读取亮度；面板上的亮度变化和熄屏/亮屏尚未验证。"

[items.touchscreen]
status = "Works"
note = "NT36532E touch through the THP service; the stylus is untested."
note_zh = "NT36532E 触摸经 THP 服务工作；手写笔未测试。"
verified = "2026-10-05"

[items.buttons]
status = "Untested"
note = "Volume and power keys drive the U-Boot and recovery menus; their desktop actions are untested."
note_zh = "音量键和电源键可操作 U-Boot 与 recovery 菜单；桌面中的动作未测试。"

[items.external-display]
status = "Untested"
note = "A 4K monitor worked on an earlier kernel; the current kernel and USB role policy are not retested."
note_zh = "较早内核上曾驱动 4K 显示器；当前内核与 USB 角色策略下未重新测试。"

[items.gpu-gl]
status = "Untested"
note = "Freedreno (Adreno 740) renders the desktop and glmark2 in software checks; on-screen output is not yet verified."
note_zh = "软件检查中 Freedreno（Adreno 740）可渲染桌面和 glmark2；屏幕输出尚未验证。"

[items.gpu-vulkan]
status = "Untested"
note = "Turnip (Adreno 740) renders a Vulkan demo in software checks; on-screen output is not yet verified."
note_zh = "软件检查中 Turnip（Adreno 740）可渲染 Vulkan 演示；屏幕输出尚未验证。"

[items.video-decode]
status = "Untested"
note = "Iris decodes H.264, HEVC, VP9 and AV1 pixel-identically to software and mpv plays via VA-API; on-screen playback is not yet verified."
note_zh = "Iris 解码 H.264、HEVC、VP9 和 AV1 的结果与软件解码逐像素一致，mpv 可经 VA-API 播放；屏幕播放尚未验证。"

[items.speaker]
status = "Broken"
note = "All six CS35L43 amplifiers bind, but the UCM lookup fails, so PipeWire has no output."
note_zh = "六颗 CS35L43 功放均已绑定，但 UCM 查找失败，PipeWire 没有输出。"

[items.headphones]
status = "N/A"
note = "The tablet has no 3.5 mm headphone jack."
note_zh = "该平板没有 3.5 毫米耳机孔。"

[items.microphone]
status = "Broken"
note = "A capture PCM exists, but the UCM lookup fails, so PipeWire has no input."
note_zh = "已有录音 PCM，但 UCM 查找失败，PipeWire 没有输入。"

[items.camera]
status = "Untested"
note = "libcamera captures front scenes and rear test patterns; image quality is not yet evaluated and the ISP is uncalibrated."
note_zh = "libcamera 可拍摄前置场景和后置测试图案；图像质量尚未评估，ISP 未校准。"

[items.camera-flash]
status = "Untested"
note = "Flash LED class devices are enabled; the flash is untested."
note_zh = "已启用闪光灯 LED 设备；闪光灯未测试。"

[items.wifi]
status = "Works"
note = "WCN7850 autoconnects at 80 MHz with two streams and carries SSH, including after suspend; throughput is unmeasured."
note_zh = "WCN7850 以 80 MHz 双流自动连接并承载 SSH，挂起后亦可用；吞吐量未测量。"

[items.bluetooth]
status = "Partial"
note = "LE and BR/EDR discovery work; pairing and audio are untested on the current kernel."
note_zh = "LE 与 BR/EDR 扫描可用；当前内核下配对和音频未测试。"

[items.usb-network]
status = "Partial"
note = "NCM SSH works in the system and recovery at 10 Gb/s, but the host sometimes needed a manual address."
note_zh = "系统与 recovery 中 NCM SSH 可在 10 Gb/s 下工作，但主机端有时需手动设置地址。"

[items.usb-host]
status = "Untested"
note = "A USB game controller worked on an earlier kernel; the current kernel is untested."
note_zh = "较早内核上 USB 游戏手柄可用；当前内核未测试。"

[items.mobile-data]
status = "N/A"
note = "Wi-Fi-only tablet without a cellular modem."
note_zh = "仅 Wi-Fi 版平板，没有蜂窝调制解调器。"

[items.calls]
status = "N/A"
note = "Wi-Fi-only tablet without a cellular modem."
note_zh = "仅 Wi-Fi 版平板，没有蜂窝调制解调器。"

[items.sms]
status = "N/A"
note = "Wi-Fi-only tablet without a cellular modem."
note_zh = "仅 Wi-Fi 版平板，没有蜂窝调制解调器。"

[items.gnss]
status = "Untested"
note = "Receiver presence is not established."
note_zh = "尚未确认是否有定位接收器。"

[items.nfc]
status = "Untested"
note = "NFC presence is not established."
note_zh = "尚未确认是否有 NFC。"

[items.battery]
status = "Partial"
note = "Fuel gauge readings are plausible while charging; a discharge is not yet tested."
note_zh = "充电时电量计读数合理；放电尚未测试。"

[items.charging]
status = "Partial"
note = "The battery charged from 3% to 82%, with MiPPS fast charging; a full charge cycle is not yet tested."
note_zh = "电池可从 3% 充至 82%，支持 MiPPS 快充；完整充电周期尚未测试。"

[items.suspend]
status = "Partial"
note = "Suspend and resume succeed and Wi-Fi recovers; power draw and other peripherals are unverified."
note_zh = "挂起与恢复成功且 Wi-Fi 可恢复；功耗与其他外设未验证。"

[items.shutdown]
status = "Partial"
note = "Reboot works repeatedly; power-off and cold boot are not yet verified."
note_zh = "重启可重复成功；关机与冷启动尚未验证。"

[items.cpu-frequency]
status = "Untested"

[items.thermal]
status = "Untested"

[items.accelerometer]
status = "Untested"
note = "Auto-rotation worked on an earlier kernel; the optional sensor stack is untested on the current kernel."
note_zh = "较早内核上自动旋转可用；当前内核下可选传感器栈未测试。"

[items.magnetometer]
status = "Untested"

[items.ambient-light]
status = "Untested"

[items.proximity]
status = "Untested"
note = "Sensor presence is not established."
note_zh = "尚未确认是否有该传感器。"

[items.hall]
status = "Untested"
note = "The Hall input is described in the device tree; cover behavior is untested."
note_zh = "设备树中已描述霍尔输入；保护套行为未测试。"

[items.haptics]
status = "Untested"
note = "Vibration motor presence is not established."
note_zh = "尚未确认是否有振动马达。"

[items.fingerprint]
status = "Untested"
note = "The FPC1553 driver and fprintd are packaged; enrollment and verification are untested."
note_zh = "已打包 FPC1553 驱动与 fprintd；录入与验证未测试。"
