# Polaris support status; see docs/status/items.toml for the items and the
# meaning of each status. Regenerate the pages with tools/status-pages.py.

[device]
name = "Xiaomi Mi MIX 2S (polaris)"
name_zh = "小米 MIX 2S（polaris）"
soc = "Qualcomm SDM845"
kernel = "Nixpkgs Linux 7.3 with Polaris patches"
kernel_zh = "Nixpkgs Linux 7.3 及 Polaris 补丁"
updated = "2026-10-30"

[items.boot-chain]
status = "Works"
note = "ABL → U-Boot (boot) → systemd-boot on FAT `system` → Linux EFI stub, root on `userdata`."
note_zh = "ABL → U-Boot（boot）→ FAT `system` 上的 systemd-boot → Linux EFI stub，根分区为 `userdata`。"

[items.generations]
status = "Works"
note = "Update, rollback and restore each booted the selected generation; `boot` stayed unchanged."
note_zh = "更新、回滚与恢复均启动所选代际；`boot` 保持不变。"

[items.ram-recovery]
status = "Partial"
note = "The installed recovery boots independently and served storage operations over ADB; the current SSH-based recovery is not hardware-tested."
note_zh = "已安装的 recovery 可独立启动，并经 ADB 完成存储操作；当前基于 SSH 的 recovery 尚未真机测试。"

[items.first-install]
status = "Partial"
note = "Recovery prepared FAT `/boot` and installed EFI files and U-Boot that boot; installation onto an empty root is untested."
note_zh = "recovery 已准备 FAT `/boot` 并安装可启动的 EFI 文件和 U-Boot；在空根分区上的安装未测试。"

[items.reboot-modes]
status = "Works"
note = "The systemd-boot bootloader and recovery entries work; a Linux reboot with the `bootloader` argument reached fastboot."
note_zh = "systemd-boot 的 bootloader 和 recovery 菜单项可用；Linux 以 `bootloader` 参数重启可进入 fastboot。"

[items.internal-storage]
status = "Works"
note = "UFS 2.1 holds ext4 `userdata` and FAT `system`; the stock GPT is unchanged."
note_zh = "UFS 2.1 承载 ext4 `userdata` 和 FAT `system`；原厂 GPT 保持不变。"

[items.removable-storage]
status = "N/A"
note = "The MIX 2S has no microSD slot."
note_zh = "MIX 2S 没有 microSD 卡槽。"

[items.display]
status = "Works"
note = "NT35596S DSI panel at 1080×2160 through MSM DRM, including the first frame after boot."
note_zh = "NT35596S DSI 面板经 MSM DRM 以 1080×2160 显示，开机首帧正常。"
verified = "2026-09-15"

[items.backlight]
status = "Partial"
note = "The panel turns off and on with the power key; brightness changes on the panel are not yet verified."
note_zh = "电源键可关闭和点亮屏幕；面板上的亮度调节尚未验证。"
verified = "2026-10-04"

[items.touchscreen]
status = "Works"
note = "Touch unlock and desktop input work; rotated input mapping in the current Niri session is not separately verified."
note_zh = "触摸解锁与桌面输入可用；当前 Niri 会话的旋转输入映射未单独验证。"
verified = "2026-09-15"

[items.buttons]
status = "Partial"
note = "The power key toggles and reboots the charging screen; desktop and volume-key actions are not yet verified."
note_zh = "电源键可在充电界面亮灭屏和重启；桌面与音量键动作尚未验证。"
verified = "2026-10-04"

[items.external-display]
status = "Untested"
note = "DisplayPort alternate mode on this USB-C port is not established."
note_zh = "尚未确认该 USB-C 接口是否支持 DisplayPort 替代模式。"

[items.gpu-gl]
status = "Untested"
note = "Freedreno (Adreno 630) renders the desktop and scored 663 in glmark2; on-screen output is not yet verified."
note_zh = "Freedreno（Adreno 630）可渲染桌面，glmark2 得分 663；屏幕输出尚未验证。"

[items.gpu-vulkan]
status = "Untested"
note = "Turnip scored 1407 in vkmark; on-screen output is not yet verified."
note_zh = "Turnip 在 vkmark 中得分 1407；屏幕输出尚未验证。"

[items.video-decode]
status = "Works"
note = "H.264 and HEVC 8-bit play in mpv through Venus V4L2; HEVC Main 10 needs the VA-API path."
note_zh = "H.264 与 HEVC 8-bit 可经 Venus V4L2 在 mpv 中播放；HEVC Main 10 需使用 VA-API 路径。"
verified = "2026-09-23"

[items.speaker]
status = "Partial"
note = "Video audio was heard from the speakers; audibility after the latest UCM fix is not yet verified."
note_zh = "曾听到扬声器播放的视频声音；最新 UCM 修复后的可听性尚未验证。"
verified = "2026-09-23"

[items.headphones]
status = "N/A"
note = "No 3.5 mm jack."
note_zh = "无 3.5 mm 耳机孔。"
[items.microphone]
status = "Broken"
note = "Capture streams open, but the recorded samples are silent."
note_zh = "录音流可以打开，但录到的样本全为静音。"

[items.camera]
status = "Partial"
note = "Front OV5675 and rear main IMX363 capture through libcamera; the auxiliary rear sensor, autofocus and tuning are missing."
note_zh = "前置 OV5675 与后置主摄 IMX363 可经 libcamera 拍摄；缺少后置副摄、自动对焦和图像调校。"
verified = "2026-09-27"

[items.camera-flash]
status = "Untested"
note = "No flash control has been tested."
note_zh = "尚未测试闪光灯控制。"

[items.wifi]
status = "Works"
note = "WCN3990 connects at 5 GHz and 160 MHz, gets DHCP, carries traffic and reconnects; suspend recovery is untested."
note_zh = "WCN3990 可在 5 GHz、160 MHz 下连接、获取 DHCP、传输数据并自动重连；挂起恢复未测试。"

[items.bluetooth]
status = "Partial"
note = "Interoperates with a real device; pairing with an audio or input profile is not covered."
note_zh = "可与真实设备互通；未覆盖音频或输入配置文件的配对使用。"

[items.usb-network]
status = "Works"
note = "NCM with DHCP and SSH in the system, including system updates over USB."
note_zh = "系统中 NCM、DHCP 和 SSH 可用，并可经 USB 更新系统。"

[items.usb-host]
status = "Untested"
note = "Host mode is configured; VBUS output and device enumeration are unverified."
note_zh = "已配置主机模式；VBUS 输出与设备枚举未验证。"

[items.mobile-data]
status = "Broken"
note = "The modem runs for Wi-Fi support, but ModemManager and a cellular data path are not enabled."
note_zh = "调制解调器为支持 Wi-Fi 而运行，但未启用 ModemManager 和蜂窝数据路径。"

[items.calls]
status = "Broken"
note = "No telephony stack or call-audio path is enabled."
note_zh = "未启用电话软件栈或通话音频路径。"

[items.sms]
status = "Broken"
note = "No SMS path is enabled."
note_zh = "未启用短信路径。"

[items.gnss]
status = "Untested"
note = "No location fix or userspace integration."
note_zh = "无定位结果，也无用户空间集成。"

[items.nfc]
status = "Untested"
note = "No NFC device or test is recorded."
note_zh = "尚无 NFC 设备或测试记录。"

[items.battery]
status = "Partial"
note = "PMI8998 fuel gauge readings are plausible; a full discharge is not yet tested."
note_zh = "PMI8998 电量计读数合理；完整放电尚未测试。"

[items.charging]
status = "Partial"
note = "Charges at upstream SMB2 limits (1 A) and has an off-mode charging screen; termination and a complete charge cycle are not yet verified."
note_zh = "按上游 SMB2 限制（1 A）充电并提供关机充电界面；充满终止和完整充电周期尚未验证。"

[items.suspend]
status = "Untested"
note = "Suspend, power saving and resume are not yet tested."
note_zh = "挂起、省电与唤醒恢复尚未测试。"

[items.shutdown]
status = "Partial"
note = "Reboot works and shutdown on charger power enters the charging screen; cold boot from the power key is untested."
note_zh = "重启可用，插电关机会进入充电界面；电源键冷启动未测试。"

[items.cpu-frequency]
status = "Partial"
note = "Both clusters expose `schedutil` policies (up to 1.77 and 2.65 GHz); load following is not measured."
note_zh = "两个 CPU 簇均有 `schedutil` 策略（最高 1.77 和 2.65 GHz）；未测量频率随负载变化。"

[items.thermal]
status = "Partial"
note = "Thermal zones report plausible temperatures under load; throttling is untested."
note_zh = "负载下温度区读数合理；降频未测试。"

[items.accelerometer]
status = "Untested"
note = "The sensor DSP delivers three-axis samples to the IIO proxy; desktop rotation is not yet verified."
note_zh = "传感器 DSP 可向 IIO 代理提供三轴数据；桌面旋转尚未验证。"

[items.magnetometer]
status = "Untested"

[items.ambient-light]
status = "Untested"

[items.proximity]
status = "Untested"

[items.hall]
status = "Untested"
note = "Sensor presence is not established."
note_zh = "尚未确认是否有该传感器。"

[items.haptics]
status = "Untested"
note = "No vibration driver or test is recorded."
note_zh = "尚无振动驱动或测试记录。"

[items.fingerprint]
status = "Untested"
note = "No fingerprint driver or test is recorded."
note_zh = "尚无指纹驱动或测试记录。"
