# Support status items shared by every device page.
#
# Every docs/<device>/status.toml must give each item below a status; the
# generator (tools/status-pages.py) refuses missing, unknown or duplicate
# items. `works` describes the behaviour a Works item shows on the device.
# Device entries may record the date of the last real-device check as
# `verified = "YYYY-MM-DD"` and a Geekbench result URL as `benchmark`.
# Partial and Broken always need a short note. Add new items here first, then
# to every device file.

[statuses.Works]
en = "The complete function passed a real-device test."
zh = "完整功能已通过真机测试。"

[statuses.Partial]
en = "A useful subset works, or a known reliability or coverage gap remains."
zh = "部分功能可用，或仍有已知的可靠性或覆盖缺口。"

[statuses.Broken]
en = "The hardware exists, but the integration is missing or does not work."
zh = "硬件存在，但缺少集成或无法使用。"

[statuses.Untested]
en = "The hardware exists, but there is no sufficient real-device result yet."
zh = "硬件存在，但尚无足够的真机测试结果。"

[statuses."N/A"]
en = "The device does not have this hardware."
zh = "设备没有此硬件。"

