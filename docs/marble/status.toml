# Marble support status; see docs/status/items.toml for the items and the
# meaning of each status. Regenerate the pages with tools/status-pages.py.

[device]
name = "Xiaomi Redmi Note 12 Turbo / POCO F5 (marble)"
name_zh = "小米 Redmi Note 12 Turbo / POCO F5（marble）"
soc = "Qualcomm SM7475 (Snapdragon 7+ Gen 2)"
kernel = "Linux 7.3 with Marble patches"
kernel_zh = "Linux 7.3 及 Marble 补丁"
updated = "2026-11-02"

[items.boot-chain]
status = "Works"
note = "ABL → U-Boot (`boot_b`) → systemd-boot on the `linux-boot` ESP → Linux 7.3; U-Boot marks slot B successful."
note_zh = "ABL → U-Boot（`boot_b`）→ `linux-boot` ESP 上的 systemd-boot → Linux 7.3；U-Boot 将槽位 B 标记为成功。"

[items.generations]
status = "Partial"
note = "New generations boot by default; a rollback to an older generation is not recorded."
note_zh = "新代际默认启动；尚无回滚到旧代际的记录。"

[items.ram-recovery]
status = "Partial"
note = "Recovery boots RAM-only through `fastboot boot` with USB SSH and storage operations; it is not installed to its own partition."
note_zh = "recovery 通过 `fastboot boot` 仅在内存中启动，USB SSH 与存储操作可用；尚未安装到独立分区。"

[items.first-install]
status = "Works"
note = "`prepare-install`, `format-root` and `install-initial` installed a system that boots from `boot_b`."
note_zh = "`prepare-install`、`format-root` 和 `install-initial` 安装的系统可从 `boot_b` 启动。"

[items.reboot-modes]
status = "Partial"
note = "Rebooting to the bootloader from recovery reaches fastboot; the recovery argument and the installed system's reboot modes are unchecked."
note_zh = "从 recovery 重启到 bootloader 可进入 fastboot；recovery 参数和已安装系统的重启模式未检查。"

[items.internal-storage]
status = "Partial"
note = "Root and ESP live on UFS; a fix for UFS link failures under load has passed only short write and suspend tests."
note_zh = "根分区与 ESP 位于 UFS；针对高负载下 UFS 链路故障的修复仅通过了短时写入与挂起测试。"

[items.removable-storage]
status = "N/A"
note = "The phone has no microSD slot."
note_zh = "该手机没有 microSD 卡槽。"

[items.display]
status = "Untested"
note = "The panel showed the desktop with a diagnostic kernel; the later release-kernel fix is only checked in software."
note_zh = "面板曾在诊断内核上显示桌面；之后发布内核的修复仅经软件检查。"
[items.backlight]
status = "Untested"
note = "Brightness values and DPMS off/on change in software; the effect on the panel is not yet verified."
note_zh = "亮度值与 DPMS 关闭/开启在软件中生效；面板上的效果尚未验证。"

[items.touchscreen]
status = "Untested"
note = "The Goodix touchscreen reports input; mapping in the desktop is not yet verified."
note_zh = "Goodix 触摸屏可上报输入；桌面中的映射尚未验证。"

[items.buttons]
status = "Untested"
note = "Power and volume keys work in U-Boot and the power key wakes from suspend; desktop actions are not yet verified."
note_zh = "电源键与音量键在 U-Boot 中可用，电源键可从挂起唤醒；桌面中的操作尚未验证。"

[items.external-display]
status = "N/A"

[items.gpu-gl]
status = "Untested"
note = "The niri desktop renders on the Adreno GPU in software checks; on-screen output with the current kernel is not yet verified and no GL benchmark has been run."
note_zh = "软件检查显示 niri 桌面经 Adreno GPU 渲染；当前内核的屏幕输出尚未验证，也未运行 GL 基准测试。"
[items.gpu-vulkan]
status = "Untested"

[items.video-decode]
status = "Untested"
note = "Iris decodes H.264, HEVC and VP9 frame-identical to software; on-screen playback is not yet verified."
note_zh = "Iris 解码 H.264、HEVC 和 VP9 的帧与软件解码一致；屏幕播放尚未验证。"

[items.speaker]
status = "Works"
note = "Both speakers play music cleanly at the stock level; there is no speaker protection, so keep moderate volumes."
note_zh = "两个扬声器均能以原厂音量清晰播放音乐；没有扬声器保护，请保持适中音量。"
verified = "2026-10-25"

[items.headphones]
status = "Broken"
note = "The wired headset path (headphones, headset microphone, jack detection) is not ported."
note_zh = "有线耳机通路（耳机、耳机麦克风、插孔检测）尚未移植。"

[items.microphone]
status = "Partial"
note = "The bottom microphone records with signal; other microphones are not set up."
note_zh = "底部麦克风可录到信号；其他麦克风尚未配置。"
verified = "2026-10-25"

[items.camera]
status = "Partial"
note = "The wide, ultra-wide, macro and front cameras capture RAW and processed images at 30 fps through libcamera and PipeWire, one camera at a time. Picture orientation and colour are not yet verified; autofocus, flash and image tuning are not implemented."
note_zh = "主摄、超广角、微距与前置摄像头可通过 libcamera 与 PipeWire 以 30 fps 拍摄 RAW 与处理后的图像（一次一个）。画面方向与色彩尚未验证；自动对焦、闪光灯与画质调校尚未实现。"

[items.camera-flash]
status = "Untested"

[items.wifi]
status = "Works"
note = "WCN6855 associates and carries traffic; its firmware crashed after two of eight resumes and recovered."
note_zh = "WCN6855 可关联并传输数据；八次唤醒中有两次固件崩溃后自动恢复。"

[items.bluetooth]
status = "Partial"
note = "Pairs with Secure Simple Pairing. With a headset, audio playback (A2DP, including LDAC) and remote control (AVRCP volume in both directions, play and pause) work. Hands-free audio (HFP) connects with CVSD, mSBC and LC3-SWB and carries audio in both directions; audio to the headset is mostly clean, but the headset microphone direction has dropouts and clicks."
note_zh = "可通过安全简易配对进行配对。连接耳机时，音频播放（A2DP，含 LDAC）和遥控（AVRCP 双向音量、播放与暂停）可用。免提音频（HFP）可使用 CVSD、mSBC 和 LC3-SWB 连接并双向传输音频；发往耳机的音频基本正常，但耳机麦克风方向有断音和咔嗒声。"
[items.usb-network]
status = "Works"
note = "SSH over USB NCM works in RAM recovery and the installed system."
note_zh = "RAM recovery 和已安装系统中均可通过 USB NCM 使用 SSH。"

[items.usb-host]
status = "Untested"

[items.mobile-data]
status = "Untested"
note = "The modem starts and ModemManager lists it; no SIM test is recorded."
note_zh = "调制解调器可启动且 ModemManager 能识别；尚无 SIM 卡测试记录。"

[items.calls]
status = "Broken"
note = "Voice call audio routes are not ported."
note_zh = "语音通话音频通路尚未移植。"

[items.sms]
status = "Untested"

[items.gnss]
status = "Broken"
note = "Location needs patched libqmi and ModemManager, which are not integrated."
note_zh = "定位需要打过补丁的 libqmi 与 ModemManager，尚未集成。"

[items.nfc]
status = "Untested"
note = "Not set up."
note_zh = "尚未配置。"

[items.battery]
status = "Partial"
note = "The battery manager reports capacity and charge counter, used for suspend drain; a full discharge is unchecked."
note_zh = "电池管理器上报容量与电量计数，已用于挂起耗电测量；完整放电未检查。"

[items.charging]
status = "Partial"
note = "Charges at about 1.3 A from a USB charging downstream port (CDP, 1.45 A input limit); fast charging adapters and a full charge are not yet checked."
note_zh = "从 USB 充电下行端口（CDP，输入限流 1.45 A）以约 1.3 A 充电；快充适配器与充满尚未检查。"

[items.suspend]
status = "Partial"
note = "s2idle reaches SoC sleep and wakes by RTC and power key; drain is about 100 mA and UFS resume fixes are still in test."
note_zh = "s2idle 可进入 SoC 睡眠并由 RTC 和电源键唤醒；耗电约 100 mA，UFS 唤醒修复仍在测试中。"

[items.shutdown]
status = "Partial"
note = "Reboot works; power-off followed by a cold boot is not recorded."
note_zh = "重启可用；尚无关机后冷启动的记录。"

[items.cpu-frequency]
status = "Works"
note = "Three `schedutil` policies reach 1.80, 2.50 and 2.92 GHz; DDR reaches 3196 MHz under load."
note_zh = "三个 `schedutil` 策略分别可达 1.80、2.50 与 2.92 GHz；负载下 DDR 可达 3196 MHz。"
benchmark = "https://browser.geekbench.com/v7/cpu/782476"

[items.thermal]
status = "Untested"

[items.accelerometer]
status = "Untested"
note = "The BMI26x reports orientation and the screen rotated in all four orientations; on-screen rotation is not yet verified."
note_zh = "BMI26x 可上报方向，屏幕在四个方向均已旋转；屏幕上的旋转效果尚未验证。"

[items.magnetometer]
status = "Untested"
note = "The QMC630x is fitted but not set up."
note_zh = "已配备 QMC630x，但尚未配置。"

[items.ambient-light]
status = "Untested"
note = "The TCS3701 is fitted but not set up."
note_zh = "已配备 TCS3701，但尚未配置。"

[items.proximity]
status = "Untested"
note = "Presence of a physical proximity sensor is not established; Android uses a virtual one."
note_zh = "尚未确定是否有物理距离传感器；Android 使用虚拟距离传感器。"

[items.hall]
status = "Untested"
note = "Presence not established."
note_zh = "尚未确定是否存在。"

[items.haptics]
status = "Untested"
note = "The PM8350B haptics driver is built; vibration is not tested."
note_zh = "已构建 PM8350B 振动驱动；未测试振动。"

[items.fingerprint]
status = "Untested"
