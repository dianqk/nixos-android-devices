# T880 support status; see docs/status/items.toml for the items and the
# meaning of each status. Regenerate the pages with tools/status-pages.py.

[device]
name = "Alldocube iPlay 80 mini Ultra (t880)"
name_zh = "酷比魔方 iPlay 80 mini Ultra（t880）"
soc = "MediaTek MT6897 (Dimensity 8300)"
kernel = "Linux 7.3.1 with T880 patches"
kernel_zh = "Linux 7.3.1 及 T880 补丁"
updated = "2026-11-10"

[items.boot-chain]
status = "Works"
note = "Stock LK → U-Boot (`boot_a`) → systemd-boot on FAT `linux-boot` → Linux, root on `linux`; Android stays on slot B."
note_zh = "原厂 LK → U-Boot（`boot_a`）→ FAT `linux-boot` 上的 systemd-boot → Linux，根分区为 `linux`；Android 保留在 B 槽。"

[items.generations]
status = "Works"
note = "New generations boot by default and a rollback boots the older one; `boot_a` stays unchanged."
note_zh = "新代际默认启动，回滚可启动旧代际；`boot_a` 保持不变。"

[items.ram-recovery]
status = "Partial"
note = "Host-supplied RAM recovery boots through U-Boot USB fastboot; a working slot-A U-Boot is required."
note_zh = "通过 U-Boot USB fastboot 启动主机提供的 RAM recovery；需要 A 槽 U-Boot 正常。"

[items.first-install]
status = "Works"
note = "`prepare-install`, `install-image` and `install-initial` installed and booted the system."
note_zh = "`prepare-install`、`install-image` 和 `install-initial` 完成安装并成功启动。"

[items.reboot-modes]
status = "Works"
note = "Reboot arguments `bootloader` and `recovery` reach LK fastboot and RAM recovery; the U-Boot menu keys are untested."
note_zh = "重启参数 `bootloader` 与 `recovery` 可进入 LK fastboot 和 RAM recovery；U-Boot 菜单按键未测试。"

[items.internal-storage]
status = "Works"
note = "UFS 4.0 at HS-G5 x2 with eight hardware queues (MCQ); sequential reads reach 4.3 GB/s. Linux partitions are split from the original userdata allocation."
note_zh = "UFS 4.0 以 HS-G5 x2 运行，使用八个硬件队列（MCQ）；顺序读取可达 4.3 GB/s。Linux 分区从原 userdata 空间中划分。"

[items.removable-storage]
status = "Partial"
note = "A card is detected at UHS-I SDR104, read and hot-removed; mounting and writing are untested."
note_zh = "存储卡可在 UHS-I SDR104 下识别、读取并热拔出；挂载与写入未测试。"

[items.display]
status = "Partial"
note = "1600×2560 through mediatek-drm at 60-144 Hz. Wake restores clear output after display power cycling; intermittent half-black boots remain unresolved."
note_zh = "mediatek-drm 以 1600×2560、60-144 Hz 显示；显示电源关闭再开启后可恢复清晰画面；偶发半屏黑屏启动的问题仍未解决。"
verified = "2026-10-17"

[items.backlight]
status = "Partial"
note = "1024-level PWM brightness control works. Display power-off intermittently fails to complete."
note_zh = "PWM 亮度调节支持 1024 级。显示电源关闭偶有无法完成。"
verified = "2026-10-15"

[items.touchscreen]
status = "Works"
note = "Novatek NT36523N multi-touch in the desktop."
note_zh = "Novatek NT36523N 多点触控在桌面中可用。"
verified = "2026-10-15"

[items.buttons]
status = "Partial"
note = "Power and volume keys generate events. The power key toggles display power with the display limits above; volume actions need audio support."
note_zh = "电源键和音量键可产生事件；电源键用于切换显示电源，受上述显示问题影响，音量动作仍需音频支持。"
verified = "2026-10-16"

[items.external-display]
status = "Partial"
note = "720p60, 1080p60, 1440p60 and 4K30 source modes produce output through a 1080p60 capture device. Display off/on and repeated boots work; physical reconnect and other monitors remain untested."
note_zh = "720p60、1080p60、1440p60 和 4K30 信号源模式可通过 1080p60 采集设备输出画面，屏幕关闭/开启和重复启动正常；物理重插和其他显示器尚未测试。"

[items.gpu-gl]
status = "Works"
note = "Panthor with a Mesa that supports Mali v11 renders the desktop; glmark2 runs at 265 MHz-1.4 GHz."
note_zh = "panthor 配合支持 Mali v11 的 Mesa 渲染桌面；glmark2 在 265 MHz-1.4 GHz 下运行。"
verified = "2026-10-16"

[items.gpu-vulkan]
status = "Untested"
note = "PanVK (not conformant) passes a dEQP-VK subset and vkmark in software checks; on-screen output is not yet verified."
note_zh = "PanVK（未通过一致性认证）在软件检查中通过 dEQP-VK 子集和 vkmark；屏幕输出尚未验证。"

[items.video-decode]
status = "Partial"
note = "8-bit V4L2/VA-API H.264/HEVC, VP9 profile 0 and AV1 Main decode, including crop, seek and stable exported surfaces. CPU conversion/replay can be costly; 10-bit and VP8 are not exposed."
note_zh = "V4L2/VA-API 支持 8 位 H.264/HEVC、VP9 profile 0 和 AV1 Main 解码，包括裁剪、跳转及稳定的导出缓冲区。CPU 转换及重放可能开销较大；不提供 10 位及 VP8。"

[items.speaker]
status = "Broken"
note = "The AFE and AW88261 amplifiers are not integrated."
note_zh = "尚未集成 AFE 和 AW88261 功放。"

[items.headphones]
status = "Broken"
note = "Wired headsets use USB-C analog audio, which is not integrated."
note_zh = "有线耳机使用 USB-C 模拟音频，尚未集成。"

[items.microphone]
status = "Broken"
note = "The MT6368 codec and its microphones are not integrated."
note_zh = "尚未集成 MT6368 编解码器及其麦克风。"

[items.camera]
status = "Broken"
note = "No camera ISP driver is available."
note_zh = "没有可用的摄像头 ISP 驱动。"

[items.camera-flash]
status = "Broken"
note = "The rear flash LED driver is not integrated."
note_zh = "尚未集成后置闪光灯驱动。"

[items.wifi]
status = "Works"
note = "Out-of-tree connsys drivers with the stock firmware files; SSH over Wi-Fi works."
note_zh = "使用树外 connsys 驱动和原厂固件文件；可通过 Wi-Fi 使用 SSH。"

[items.bluetooth]
status = "Partial"
note = "A2DP (LDAC), AVRCP volume/playback controls and BLE keyboard/mouse input work. Audio has intermittent dropouts; opt-in mSBC and CVSD carry both directions, with CVSD also showing occasional short transients. Controller idle/wake and BlueZ power-off/reopen work. Classic HIDP is untested."
note_zh = "A2DP（LDAC）、AVRCP 音量和播放控制以及 BLE 键盘/鼠标输入可用。音频偶有中断；可选的 mSBC 和 CVSD 均支持双向音频，CVSD 还偶有短暂杂音。控制器空闲休眠、唤醒及 BlueZ 关闭后重开可用；经典蓝牙 HIDP 尚未测试。"

[items.usb-network]
status = "Works"
note = "NCM with DHCP and SSH at SuperSpeed in the system and recovery."
note_zh = "系统与 recovery 中 NCM、DHCP 和 SSH 均可用，速率为 SuperSpeed。"

[items.usb-host]
status = "Untested"
note = "The port switches to the host role and xHCI binds; no USB device has been tested."
note_zh = "端口可切换为主机角色并绑定 xHCI；尚未测试 USB 设备。"

[items.mobile-data]
status = "Works"
note = "5G NR and LTE data through ModemManager; the modem starts once per boot."
note_zh = "通过 ModemManager 使用 5G NR 与 LTE 数据；调制解调器每次启动只启动一次。"

[items.calls]
status = "Broken"
note = "Voice calls and the modem audio path are not integrated."
note_zh = "尚未集成语音通话和调制解调器音频通路。"

[items.sms]
status = "Works"
note = "Sending and receiving work on 5G NR (over IMS) and LTE."
note_zh = "在 5G NR（经 IMS）和 LTE 下均可收发。"

[items.gnss]
status = "Broken"
note = "GNSS depends on closed vendor userspace and is not integrated."
note_zh = "GNSS 依赖闭源厂商用户态，尚未集成。"

[items.nfc]
status = "Untested"
note = "Presence not established."
note_zh = "尚未确认是否有此硬件。"

[items.battery]
status = "Partial"
note = "MT6375 gauge values are plausible while charging; an unplugged discharge check is pending."
note_zh = "充电时 MT6375 电量计数值合理；未插电放电检查待完成。"

[items.charging]
status = "Partial"
note = "Bounded 5 V charging at about 9 W works and ends at hardware termination; battery care is available but off by default; when enabled it holds the battery at 75-80 % while plugged in (`nexusctl battery full-charge` charges once to 100 %)."
note_zh = "约 9 W 的受限 5 V 充电可用，并在硬件终止时结束；电池养护可选但默认关闭；启用后插电时将电量保持在 75-80 %（`nexusctl battery full-charge` 可一次性充满）。"

[items.suspend]
status = "Broken"
note = "Suspend is not implemented; only CPU core idle states work."
note_zh = "尚未实现挂起；仅 CPU 核心空闲状态可用。"

[items.shutdown]
status = "Works"
note = "Power-off and reboot complete; with USB attached the device powers on again by itself."
note_zh = "关机与重启均可完成；连接 USB 时设备会自行重新开机。"

[items.cpu-frequency]
status = "Works"
note = "`mtk-cpufreq-hw` with schedutil scales the three clusters up to 2.2, 3.2 and 3.35 GHz (at its top step the prime core runs at about 3.0 GHz, as on stock Android); per-core throughput equals stock Android. Multi-core results are lower under sustained load because the firmware temperature target throttles the CPUs. Geekbench 7 1247 single-core / 3565 multi-core:"
note_zh = "`mtk-cpufreq-hw` 与 schedutil 将三个簇分别调至最高 2.2、3.2 与 3.35 GHz（最高档时超大核实际约 3.0 GHz，与原厂 Android 相同）；单核吞吐量与原厂 Android 相同。持续负载下固件温度目标会限制 CPU，多核成绩因此较低。Geekbench 7 单核 1247 / 多核 3565："
benchmark = "https://browser.geekbench.com/v7/cpu/645266"
[items.thermal]
status = "Works"
note = "28 LVTS zones; CPU and GPU throttle near 95 °C; there is no skin temperature control."
note_zh = "28 个 LVTS 温区；CPU 与 GPU 在约 95 °C 降频；没有机身表面温度控制。"

[items.accelerometer]
status = "Partial"
note = "Auto-rotation followed the device but 180° off; the orientation fix awaits a hand test."
note_zh = "自动旋转会跟随设备，但方向相差 180°；方向修正待手动测试。"
verified = "2026-10-20"

[items.magnetometer]
status = "Partial"
note = "The QMC6308 is an IIO magnetometer (`scp-magn`) through the SCP sensor hub; the response to orientation is not yet verified. The ICM4N607 gyroscope is available as `scp-gyro`."
note_zh = "QMC6308 经 SCP 传感器中枢作为 IIO 磁力计（`scp-magn`）提供；随方向变化的读数尚未验证。ICM4N607 陀螺仪以 `scp-gyro` 提供。"

[items.ambient-light]
status = "Works"
note = "JSA1130 through the SCP sensor hub as IIO illuminance; optional automatic brightness."
note_zh = "JSA1130 经 SCP 传感器中枢作为 IIO 照度提供；可选自动亮度。"

[items.proximity]
status = "N/A"
note = "The stock sensor list has no proximity sensor."
note_zh = "原厂传感器列表中没有距离传感器。"

[items.hall]
status = "Partial"
note = "Cover close/open is reported and turns the screen off; one session hung after repeated cover cycles."
note_zh = "可报告保护套开合并熄屏；一次测试在多次开合后卡死。"
verified = "2026-10-20"

[items.haptics]
status = "Works"
note = "`regulator-haptic` on the MT6368 VIBR rail."
note_zh = "MT6368 VIBR 电源上的 `regulator-haptic`。"
verified = "2026-10-16"

[items.fingerprint]
status = "Untested"
note = "Presence not established; the vendor device tree has a Goodix node and no driver is integrated."
note_zh = "尚未确认是否有此硬件；厂商设备树含 Goodix 节点，未集成驱动。"
