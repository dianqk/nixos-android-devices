# Clover support status; see docs/status/items.toml for the items and the
# meaning of each status. Regenerate the pages with tools/status-pages.py.

[device]
name = "Xiaomi Mi Pad 4 LTE (clover)"
name_zh = "小米平板 4 LTE（clover）"
soc = "Qualcomm SDM660"
kernel = "Nixpkgs Linux 7.3 with Clover patches"
kernel_zh = "Nixpkgs Linux 7.3 及 Clover 补丁"
updated = "2026-11-01"

[items.boot-chain]
status = "Works"
note = "ABL → U-Boot (boot) → systemd-boot on FAT `system` → Linux 7.3, root on `userdata`."
note_zh = "ABL → U-Boot（boot）→ FAT `system` 上的 systemd-boot → Linux 7.3，根分区为 `userdata`。"

[items.generations]
status = "Works"
note = "Update and rollback booted the selected generation; `boot` stayed unchanged."
note_zh = "更新与回滚均启动所选代际；`boot` 保持不变。"

[items.ram-recovery]
status = "Works"
note = "ABL boots `recovery`: the same U-Boot with a FIT ramdisk (LZMA kernel, xz initrd) under ABL's 35 MiB ramdisk limit. SSH host key persists."
note_zh = "ABL 启动 `recovery`：同一 U-Boot 加 FIT ramdisk（LZMA 内核、xz initrd），低于 ABL 的 35 MiB ramdisk 上限。SSH 主机密钥持久保存。"

[items.first-install]
status = "Works"
note = "`format-root`, `prepare-boot` and `install-initial` (including resume) installed and booted the system."
note_zh = "`format-root`、`prepare-boot` 和 `install-initial`（含续装）完成安装并成功启动。"

[items.reboot-modes]
status = "Works"
note = "Reboot arguments `bootloader` and `recovery` reach ABL fastboot and RAM recovery. The EFI menu entries are untested."
note_zh = "重启参数 `bootloader` 与 `recovery` 可进入 ABL fastboot 和 RAM recovery。EFI 菜单项未测试。"

[items.internal-storage]
status = "Works"
note = "eMMC HS400; the stock GPT is unchanged."
note_zh = "eMMC HS400；原厂 GPT 保持不变。"

[items.removable-storage]
status = "Untested"
note = "The SDHCI controller is enabled; no card test."
note_zh = "SDHCI 控制器已启用；未测试存储卡。"

[items.display]
status = "Works"
note = "NT51021 DSI panel at 1200×1920 through MSM DRM."
note_zh = "NT51021 DSI 面板经 MSM DRM 以 1200×1920 显示。"
verified = "2026-10-30"

[items.backlight]
status = "Untested"
note = "Brightness changes are unchecked. Software reports DPMS off after 60 s at the login screen."
note_zh = "亮度调节未检查。软件显示登录界面 60 秒后 DPMS 关闭。"

[items.touchscreen]
status = "Untested"
note = "FT5x06 passed on an earlier image; the current Niri session needs a check."
note_zh = "FT5x06 在较早镜像上通过；当前 Niri 会话待检查。"

[items.buttons]
status = "Untested"
note = "Power, volume and Hall inputs enumerate; their desktop actions are untested."
note_zh = "电源、音量和霍尔输入设备已枚举；桌面中的动作未测试。"

[items.external-display]
status = "N/A"

[items.gpu-gl]
status = "Untested"
note = "Freedreno (Adreno 512) loads; on-screen rendering and performance are not yet verified."
note_zh = "Freedreno（Adreno 512）已加载；屏幕渲染与性能尚未验证。"

[items.gpu-vulkan]
status = "Broken"
note = "Mesa Turnip does not support Adreno 5xx."
note_zh = "Mesa Turnip 不支持 Adreno 5xx。"

[items.video-decode]
status = "Untested"
note = "Venus creates its V4L2 devices; decoding is not yet tested."
note_zh = "Venus 已创建 V4L2 设备；解码尚未测试。"

[items.speaker]
status = "Broken"
note = "The SDM660 UCM has no speaker route."
note_zh = "SDM660 UCM 没有扬声器路由。"

[items.headphones]
status = "Untested"
note = "UCM headphone routes exist; playback is unverified."
note_zh = "已有 UCM 耳机路由；播放未验证。"

[items.microphone]
status = "Untested"
note = "UCM microphone routes exist; capture is unverified."
note_zh = "已有 UCM 麦克风路由；录音未验证。"

[items.camera]
status = "Broken"
note = "No capture pipeline is integrated."
note_zh = "尚未集成拍摄管线。"

[items.camera-flash]
status = "N/A"

[items.wifi]
status = "Partial"
note = "WCN3990 connects at VHT80 2x2 and survives disconnect/reconnect cycles (iwd needs ControlPortOverNL80211=false). Under severe memory pressure with Wi-Fi connected the tablet resets; the modem that runs the WLAN firmware sometimes restarts several times after boot, delaying Wi-Fi by up to about 2 minutes."
note_zh = "WCN3990 以 VHT80 2x2 连接，断开重连正常（iwd 需 ControlPortOverNL80211=false）。Wi-Fi 连接时若内存严重不足，平板会重启；运行 WLAN 固件的调制解调器在开机后有时会重启数次，使 Wi-Fi 最多延迟约 2 分钟可用。"
[items.bluetooth]
status = "Partial"
note = "Discovery, SSP pairing with an authenticated key and L2CAP echo work; no audio or input profile was tested, and encryption is not shown."
note_zh = "发现、使用认证密钥的 SSP 配对和 L2CAP 回显可用；未测试音频或输入配置文件，也未证实链路加密。"
[items.usb-network]
status = "Works"
note = "NCM with DHCP and SSH in the system and recovery."
note_zh = "系统与 recovery 中 NCM、DHCP 和 SSH 均可用。"

[items.usb-host]
status = "Untested"
note = "VBUS output and host enumeration are unverified."
note_zh = "VBUS 输出与主机枚举未验证。"

[items.mobile-data]
status = "Broken"
note = "The modem runs, but no IPA or cellular data path is enabled."
note_zh = "调制解调器已运行，但未启用 IPA 或蜂窝数据路径。"

[items.calls]
status = "Untested"
note = "No telephony stack; voice support of the LTE model is not established."
note_zh = "无电话软件栈；尚未确认 LTE 型号是否支持语音。"

[items.sms]
status = "Broken"
note = "No SMS path is enabled."
note_zh = "未启用短信路径。"

[items.gnss]
status = "Untested"
note = "No location fix or userspace integration."
note_zh = "无定位结果，也无用户空间集成。"

[items.nfc]
status = "N/A"

[items.battery]
status = "Partial"
note = "PMI8998 fuel gauge readings are plausible; a discharge is not yet tested."
note_zh = "PMI8998 电量计读数合理；放电尚未测试。"

[items.charging]
status = "Partial"
note = "Charges from a USB host port and reports external power; a full charge cycle is not yet tested."
note_zh = "可从 USB 主机端口充电并报告外部供电；完整充电周期尚未测试。"
[items.suspend]
status = "Broken"
note = "An s2idle test with an RTC wake alarm did not return within 5 minutes; the system policy disables suspend."
note_zh = "带 RTC 唤醒闹钟的 s2idle 测试 5 分钟内未返回；系统策略已禁用挂起。"
[items.shutdown]
status = "Partial"
note = "Reboot works repeatedly; power-off and cold boot are not yet verified."
note_zh = "重启可重复成功；关机与冷启动尚未验证。"

[items.cpu-frequency]
status = "Works"
note = "OSM with closed-loop CPRh voltage control scales both clusters with schedutil across the full table: silver up to 1843.2 MHz, gold up to 2208 MHz. Geekbench 7 389 single-core / 1036 multi-core:"
note_zh = "OSM 与闭环 CPRh 电压控制配合 schedutil 在完整频率表内调频：小核最高 1843.2 MHz，大核最高 2208 MHz。Geekbench 7 单核 389 / 多核 1036："
benchmark = "https://browser.geekbench.com/v7/cpu/770857"
[items.thermal]
status = "Works"
note = "Under sustained all-core load the CPU cooling maps throttle both clusters at the 70 °C passive trip; the GPU uses devfreq."
note_zh = "全核持续负载下，CPU 冷却映射在 70 °C 被动阈值处为两个簇降频；GPU 使用 devfreq。"
[items.accelerometer]
status = "Untested"
note = "No sensor is exposed to Linux (no IIO device)."
note_zh = "Linux 中未暴露该传感器（无 IIO 设备）。"
[items.magnetometer]
status = "Untested"
note = "No sensor is exposed to Linux (no IIO device)."
note_zh = "Linux 中未暴露该传感器（无 IIO 设备）。"
[items.ambient-light]
status = "Untested"
