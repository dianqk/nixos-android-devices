# Asphalt support status; see docs/status/items.toml for the items and the
# meaning of each status. Regenerate the pages with tools/status-pages.py.

[device]
name = "Lenovo Legion Y700 2023 (TB320FC) (asphalt)"
name_zh = "联想拯救者 Y700 2023（TB320FC）（asphalt）"
soc = "Qualcomm SM8475"
kernel = "Nixpkgs Linux 7.3-rc6 with Asphalt patches"
kernel_zh = "Nixpkgs Linux 7.3-rc6 及 Asphalt 补丁"
updated = "2026-10-30"

[items.boot-chain]
status = "Works"
note = "ABL → U-Boot (`boot_b`) → systemd-boot on the FAT `linux-boot` ESP → Linux, root on ext4 `linux`; slot A and super stay untouched."
note_zh = "ABL → U-Boot（`boot_b`）→ FAT `linux-boot` ESP 上的 systemd-boot → Linux，根分区为 ext4 `linux`；A 槽与 super 保持不变。"

[items.generations]
status = "Works"
note = "A new generation booted by default and a rollback booted the older one; `boot_b` stayed unchanged."
note_zh = "新代际默认启动，回滚后旧代际再次启动；`boot_b` 保持不变。"

[items.ram-recovery]
status = "Works"
note = "Recovery in `recovery_b` boots via the OEM bootloader; USB SSH, offline filesystem checks and generation deploy work."
note_zh = "`recovery_b` 中的 recovery 经原厂 bootloader 启动；USB SSH、离线文件系统检查和代际部署均可用。"

[items.first-install]
status = "Partial"
note = "The installed system was set up from RAM recovery on one tablet; the current `install-initial` flow on a fresh tablet is unverified."
note_zh = "已在一台平板上通过 RAM recovery 完成安装；当前 `install-initial` 流程在全新平板上未验证。"

[items.reboot-modes]
status = "Partial"
note = "Recovery reaches the OEM bootloader; rebooting the installed system into recovery is unverified."
note_zh = "recovery 可进入原厂 bootloader；已安装系统重启进入 recovery 未验证。"

[items.internal-storage]
status = "Works"
note = "UFS holds the ext4 root and FAT ESP across reboots and updates; a 75 MHz clock limit is the default."
note_zh = "UFS 承载 ext4 根分区与 FAT ESP，经重启和更新保持正常；默认限制时钟为 75 MHz。"

[items.removable-storage]
status = "Partial"
note = "An SDXC card was detected at SDR104 and mounted read-only; writes and hot-plug are untested."
note_zh = "SDXC 卡以 SDR104 识别并只读挂载；写入与热插拔未测试。"

[items.display]
status = "Works"
note = "NT36523N dual-DSI panel at 1600×2560, 120 Hz through MSM DRM."
note_zh = "NT36523N 双 DSI 面板经 MSM DRM 以 1600×2560、120 Hz 显示。"
verified = "2026-10-03"

[items.backlight]
status = "Partial"
note = "The panel turns off and on with the power key in the charger screen; desktop brightness changes are not yet verified."
note_zh = "充电界面中可用电源键熄屏与亮屏；桌面亮度调节尚未验证。"
verified = "2026-10-04"

[items.touchscreen]
status = "Works"
note = "Novatek touch maps correctly in Niri, including all four rotations."
note_zh = "Novatek 触摸在 Niri 中映射正确，包括四个旋转方向。"
verified = "2026-10-03"

[items.buttons]
status = "Partial"
note = "The power key works in the charger screen; volume keys and desktop actions are not yet verified."
note_zh = "电源键在充电界面中可用；音量键与桌面动作尚未验证。"
verified = "2026-10-04"

[items.external-display]
status = "Untested"
note = "A 3840×2160 60 Hz DP output trains and is driven by the compositor; the picture on a monitor is not yet verified."
note_zh = "3840×2160 60 Hz DP 输出可完成链路训练并由合成器驱动；显示器上的实际画面尚未验证。"

[items.gpu-gl]
status = "Partial"
note = "The Niri desktop renders through Freedreno (Adreno 730); glmark2 ran only in automated checks and one GMU timeout fault is unexplained."
note_zh = "Niri 桌面经 Freedreno（Adreno 730）渲染；glmark2 仅在自动检查中运行，一次 GMU 超时故障原因未明。"
verified = "2026-10-03"

[items.gpu-vulkan]
status = "Untested"
note = "Turnip renders vkcube in automated checks; on-screen output is not yet verified."
note_zh = "Turnip 在自动检查中可渲染 vkcube；屏幕输出尚未验证。"

[items.video-decode]
status = "Untested"
note = "Iris decodes 180-second 1080p H.264/HEVC 8-bit through V4L2 and VA-API in automated checks; on-screen playback is not yet verified."
note_zh = "自动检查中 Iris 可经 V4L2 和 VA-API 解码 180 秒 1080p H.264/HEVC 8-bit；屏幕播放尚未验证。"

[items.speaker]
status = "Untested"
note = "The CS35L45 speaker sink exists; a heavily attenuated playback test produced no audible sound."
note_zh = "CS35L45 扬声器输出已存在；一次大幅衰减的播放测试未发出可听见的声音。"

[items.headphones]
status = "Untested"
note = "Headphone jack presence is not established."
note_zh = "尚未确认是否有耳机接口。"

[items.microphone]
status = "Untested"
note = "Capture is untested."
note_zh = "录音未测试。"

[items.camera]
status = "Works"
note = "Scene photos from all three cameras through libcamera's software ISP; tuning is generic and autofocus is missing."
note_zh = "三颗摄像头均可经 libcamera 软件 ISP 拍摄实景；调校为通用参数，无自动对焦。"
verified = "2026-09-27"

[items.camera-flash]
status = "Untested"
note = "Flash LED presence is not established; no flash control is implemented."
note_zh = "尚未确认是否有闪光灯；未实现闪光灯控制。"

[items.wifi]
status = "Works"
note = "WCN6855 associates at two-stream HE80 rates, gets DHCP and carries SSH traffic."
note_zh = "WCN6855 以双流 HE80 速率关联，获取 DHCP 并承载 SSH 流量。"

[items.bluetooth]
status = "Partial"
note = "Discovery and unpaired L2CAP echo work; pairing has not succeeded and profiles are untested."
note_zh = "发现与未配对 L2CAP 回显可用；配对尚未成功，协议配置未测试。"

[items.usb-network]
status = "Works"
note = "NCM with DHCP and SSH in the system and recovery, at USB2 and USB3 speeds."
note_zh = "系统与 recovery 中 NCM、DHCP 和 SSH 均可用，支持 USB2 与 USB3 速率。"

[items.usb-host]
status = "Untested"
note = "No host-mode session with an attached device has been tested."
note_zh = "尚未测试接入设备的主机模式。"

[items.mobile-data]
status = "N/A"
note = "TB320FC is the Wi-Fi model without a cellular modem."
note_zh = "TB320FC 为无蜂窝调制解调器的 Wi-Fi 型号。"

[items.calls]
status = "N/A"
note = "TB320FC is the Wi-Fi model without a cellular modem."
note_zh = "TB320FC 为无蜂窝调制解调器的 Wi-Fi 型号。"

[items.sms]
status = "N/A"
note = "TB320FC is the Wi-Fi model without a cellular modem."
note_zh = "TB320FC 为无蜂窝调制解调器的 Wi-Fi 型号。"

[items.gnss]
status = "Untested"
note = "GNSS hardware presence is not established."
note_zh = "尚未确认是否有卫星定位硬件。"

[items.nfc]
status = "Untested"
note = "NFC hardware presence is not established."
note_zh = "尚未确认是否有 NFC 硬件。"

[items.battery]
status = "Partial"
note = "Capacity, voltage and current follow a discharge; `power_now` is bogus and `charge_counter` is quantized."
note_zh = "容量、电压和电流随放电变化合理；`power_now` 数值错误，`charge_counter` 被量化。"

[items.charging]
status = "Partial"
note = "Off-mode charging works from a USB host near full charge; a full charge cycle and fast charging are unverified."
note_zh = "接 USB 主机时关机充电在接近满电时可用；完整充电周期与快充未验证。"

[items.suspend]
status = "Partial"
note = "s2idle reaches deep sleep and resumes; only the power key wakes it, and Bluetooth failed after one of two resumes."
note_zh = "s2idle 可进入深度睡眠并恢复；仅电源键可唤醒，两次中有一次恢复后蓝牙失效。"

[items.shutdown]
status = "Partial"
note = "Reboot and power-off usually complete; a USB gadget teardown hang and slow service stops remain open."
note_zh = "重启与关机通常可完成；USB gadget 拆除挂起与服务停止缓慢问题仍未解决。"

[items.cpu-frequency]
status = "Partial"
note = "Three `schedutil` policies change frequency under load; performance is not yet benchmarked."
note_zh = "三个 `schedutil` 策略可随负载调节频率；性能尚未经基准测试。"
[items.thermal]
status = "Partial"
note = "Thermal zones report plausible temperatures; throttling is untested."
note_zh = "温度区读数合理；降频未测试。"

[items.accelerometer]
status = "Works"
note = "SSC accelerometer drives Niri auto-rotation in all four directions."
note_zh = "SSC 加速度计驱动 Niri 在四个方向自动旋转。"
verified = "2026-10-03"

[items.magnetometer]
status = "Untested"
note = "The MMC56x3 sensor is present in SSC; readings are unverified."
note_zh = "SSC 中存在 MMC56x3 传感器；读数未验证。"

[items.ambient-light]
status = "Untested"
note = "The STK3A5x sensor is present in SSC; readings are unverified."
note_zh = "SSC 中存在 STK3A5x 传感器；读数未验证。"

[items.proximity]
status = "Untested"
note = "The STK3A5x sensor is present in SSC; readings are unverified."
note_zh = "SSC 中存在 STK3A5x 传感器；读数未验证。"

[items.hall]
status = "Untested"
note = "The BU52053NVX Hall sensor is present in SSC; cover behavior is untested."
note_zh = "SSC 中存在 BU52053NVX 霍尔传感器；保护套行为未测试。"

[items.haptics]
status = "Untested"
note = "Stock vendor files reference two haptic drivers; no Linux haptics integration is tested."
note_zh = "原厂 vendor 文件引用两个振动驱动；Linux 振动集成未测试。"

[items.fingerprint]
status = "Untested"
note = "Fingerprint reader presence is not established."
note_zh = "尚未确认是否有指纹识别器。"
