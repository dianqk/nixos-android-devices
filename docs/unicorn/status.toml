# Unicorn support status; regenerate the pages with tools/status-pages.py.
# Hardware results below come from Linux 7.3-rc6; Linux 7.3.4 needs device revalidation.
# updated records documentation changes, not a new hardware test.

[device]
name = "Xiaomi 12S Pro (unicorn)"
name_zh = "小米 12S Pro（unicorn）"
soc = "Qualcomm SM8475 (Snapdragon 8+ Gen 1)"
kernel = "Linux 7.3.4; hardware results from Linux 7.3-rc6"
kernel_zh = "Linux 7.3.4；真机结果来自 Linux 7.3-rc6"
updated = "2026-11-17"

[items.boot-chain]
status = "Works"
note = "U-Boot in boot_b boots systemd-boot and the installed Linux system; the ESP and root occupy the original userdata extent."
note_zh = "boot_b 中的 U-Boot 经 systemd-boot 启动已安装系统；ESP 与根分区占用原 userdata 空间。"

[items.generations]
status = "Partial"
note = "EFI generation updates work without rewriting U-Boot; a complete rollback test is not documented."
note_zh = "EFI 系统代更新无需重写 U-Boot；尚无完整回滚测试记录。"

[items.ram-recovery]
status = "Partial"
note = "Independent recovery boot is verified; the complete USB SSH and storage workflow needs revalidation on the current kernel."
note_zh = "已验证独立 recovery 启动；完整 USB SSH 与存储流程仍需在当前内核复验。"

[items.first-install]
status = "Untested"
note = "The Linux-only layout is implemented; the complete prepare-install and install-initial sequence is not documented as tested."
note_zh = "已实现 Linux 独占布局；尚无完整 prepare-install 与 install-initial 流程的实测记录。"

[items.reboot-modes]
status = "Untested"
note = "Bootloader and recovery reboot targets are configured; both transitions need hardware verification."
note_zh = "已配置 bootloader 与 recovery 重启目标；两条路径仍需实测。"

[items.internal-storage]
status = "Works"
note = "UFS boot and bounded file I/O passed; linux-boot and linux are split from userdata."
note_zh = "UFS 启动与有限文件读写通过；linux-boot 与 linux 从 userdata 划分。"

[items.removable-storage]
status = "N/A"
note = "The phone has no microSD slot."
note_zh = "手机没有 microSD 卡槽。"

[items.display]
status = "Works"
note = "The 1440×3200 DSC panel displays at 24/30/40/60/90/120 Hz; 60 Hz is preferred."
note_zh = "1440×3200 DSC 面板支持 24/30/40/60/90/120 Hz，默认 60 Hz。"

[items.backlight]
status = "Works"
note = "Brightness changes, screen off/on and opt-in 60↔120 Hz switching were verified; other active transitions remain experimental."
note_zh = "已验证亮度调节、熄屏/亮屏及可选的 60↔120 Hz 切换；其他活动切换仍为实验功能。"

[items.touchscreen]
status = "Works"
note = "The ST FingerTipS SPI driver provides multitouch."
note_zh = "ST FingerTipS SPI 驱动提供多点触控。"

[items.buttons]
status = "Partial"
note = "Console volume, short power press for screen off/on and long press for shutdown are implemented; desktop actions need separate configuration and testing."
note_zh = "已实现控制台音量、电源短按熄亮屏与长按关机；桌面动作需要另行配置与测试。"

[items.external-display]
status = "Untested"
note = "The USB-C DisplayPort board path is unverified and is not enabled."
note_zh = "USB-C DisplayPort 板级通路未验证，尚未启用。"

[items.gpu-gl]
status = "Partial"
note = "Adreno 730 renders through Freedreno; complete on-screen GL benchmark validation is not documented."
note_zh = "Adreno 730 经 Freedreno 渲染；尚无完整屏幕 GL 基准验证记录。"

[items.gpu-vulkan]
status = "Untested"
note = "On-screen Vulkan rendering has not been verified."
note_zh = "尚未验证屏幕 Vulkan 渲染。"

[items.video-decode]
status = "Untested"
note = "Hardware video playback has not been verified."
note_zh = "尚未验证硬件视频播放。"

[items.speaker]
status = "Works"
note = "Internal speaker playback works with separately provisioned private firmware, calibration and Music data."
note_zh = "单独提供私有固件、校准与 Music 数据后，内置扬声器播放可用。"

[items.headphones]
status = "Broken"
note = "USB-C analogue headset routing is incomplete; digital USB-C accessories are also unverified."
note_zh = "USB-C 模拟耳机路由不完整；数字 USB-C 配件也未验证。"

[items.microphone]
status = "Works"
note = "Internal microphone recording and playback were verified with the private audio runtime inputs."
note_zh = "提供私有音频运行时输入后，已验证内置麦克风录音与回放。"

[items.camera]
status = "Partial"
note = "JN1 ultra-wide and telephoto capture RAW10; front/main identification NACKs. Bayer order, exposure, software ISP, autofocus and OIS remain unverified or unimplemented."
note_zh = "JN1 超广角与长焦可采集 RAW10；前摄/主摄识别 NACK。Bayer、曝光、软件 ISP、自动对焦与 OIS 仍未验证或未实现。"

[items.camera-flash]
status = "Untested"
note = "Flash operation has not been verified."
note_zh = "尚未验证闪光灯。"

[items.wifi]
status = "Works"
note = "2.4/5 GHz association, traffic and reconnect passed; NetworkManager supplies a stable local address."
note_zh = "2.4/5 GHz 连接、传输与重连通过；NetworkManager 提供稳定本地地址。"

[items.bluetooth]
status = "Partial"
note = "Pairing, headset playback and RFCOMM transfers work with a separately provisioned factory address; firmware-download timeouts can occur. HFP and concurrent Wi-Fi/audio remain unverified."
note_zh = "单独提供原厂地址后，配对、耳机播放与 RFCOMM 传输可用；固件下载可能超时。HFP 及 Wi-Fi/音频并用未验证。"

[items.usb-network]
status = "Partial"
note = "NCM and optional ACM are configured; physical USB enumeration, DHCP and SSH need revalidation with the current role manager."
note_zh = "已配置 NCM 与可选 ACM；实际 USB 枚举、DHCP 与 SSH 仍需随当前角色管理器复验。"

[items.usb-host]
status = "Untested"
note = "Firmware-negotiated USB2 host mode is implemented; peripheral operation and VBUS supply remain unverified."
note_zh = "已实现固件协商的 USB2 主机模式；外设使用与 VBUS 供电仍未验证。"

[items.mobile-data]
status = "Untested"
note = "Cellular data has not been verified."
note_zh = "尚未验证蜂窝数据。"

[items.calls]
status = "Broken"
note = "No voice-call integration is provided."
note_zh = "未提供语音通话集成。"

[items.sms]
status = "Untested"
note = "SMS has not been verified."
note_zh = "尚未验证短信。"

[items.gnss]
status = "Untested"
note = "No location fix has been verified."
note_zh = "尚未验证定位结果。"

[items.nfc]
status = "Untested"
note = "An SN NCI reader-mode driver is included; tag and reader operation are unverified."
note_zh = "包含 SN NCI 读卡模式驱动；标签与读卡操作未验证。"

[items.battery]
status = "Untested"
note = "Board-specific ADSP battery telemetry is implemented; a full discharge validation is not documented."
note_zh = "已实现板级 ADSP 电池遥测；尚无完整放电验证记录。"

[items.charging]
status = "Untested"
note = "Authentication and input telemetry are implemented; a full charge cycle, charge-pump operation and the 120 W peak remain unverified."
note_zh = "已实现认证与输入遥测；完整充电周期、充电泵工作与 120 W 峰值仍未验证。"

[items.suspend]
status = "Partial"
note = "Bounded suspend/resume checks passed; standby power and complete peripheral recovery remain unverified."
note_zh = "有限挂起恢复检查通过；待机功耗与完整外设恢复未验证。"

[items.shutdown]
status = "Untested"
note = "Orderly shutdown is requested by the console key service; power-off, cold boot and repeated reboot acceptance remain incomplete."
note_zh = "控制台侧键服务可请求正常关机；断电、冷启动与重复重启验收尚不完整。"

[items.cpu-frequency]
status = "Untested"
note = "Frequency scaling under load on every CPU cluster has not been verified."
note_zh = "尚未验证所有 CPU 集群在负载下的频率调节。"

[items.thermal]
status = "Untested"
note = "Thermal cooling is configured; sustained-load throttling has not been verified."
note_zh = "已配置温控降频；持续负载下的限频未验证。"

[items.accelerometer]
status = "Untested"
note = "Dedicated SSC data and userspace sensor integration remain incomplete."
note_zh = "专用 SSC 数据与用户态传感器集成尚不完整。"

[items.magnetometer]
status = "Untested"
note = "Sensor readings have not been verified."
note_zh = "尚未验证传感器读数。"

[items.ambient-light]
status = "Untested"
note = "Light readings and automatic brightness have not been verified."
note_zh = "尚未验证照度读数与自动亮度。"

[items.proximity]
status = "Untested"
note = "Sensor presence and readings have not been established."
note_zh = "尚未确认传感器及其读数。"

[items.hall]
status = "Untested"
note = "Sensor presence has not been established."
note_zh = "尚未确认是否存在该传感器。"

[items.haptics]
status = "Untested"
note = "An AW86927 force-feedback driver is included; physical vibration is unverified."
note_zh = "包含 AW86927 力反馈驱动；实际振动未验证。"

[items.fingerprint]
status = "Broken"
note = "No fingerprint driver or service is included."
note_zh = "未包含指纹驱动或服务。"
