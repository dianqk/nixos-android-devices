# Aurora support status; see docs/status/items.toml for the items and the
# meaning of each status. Regenerate the pages with tools/status-pages.py.

[device]
name = "Xiaomi 14 Ultra (aurora)"
name_zh = "小米 14 Ultra（aurora）"
soc = "Qualcomm SM8650 (Snapdragon 8 Gen 3)"
kernel = "Linux 7.3 with Aurora patches"
kernel_zh = "Linux 7.3 及 Aurora 补丁"
updated = "2026-10-30"

[items.boot-chain]
status = "Works"
note = "ABL → U-Boot (`boot_b`) → systemd-boot on the FAT `linux-boot` ESP → Linux 7.3, root on `linux`; slot A stays Android."
note_zh = "ABL → U-Boot（`boot_b`）→ FAT `linux-boot` ESP 上的 systemd-boot → Linux 7.3，根分区为 `linux`；A 槽保留 Android。"

[items.generations]
status = "Works"
note = "Rolling back to an older generation and returning both booted; `boot_b` stayed unchanged."
note_zh = "回滚到旧代际并再切回均成功启动；`boot_b` 保持不变。"

[items.ram-recovery]
status = "Works"
note = "Recovery boots from `recovery_b` independently of U-Boot, with USB NCM/SSH and a persistent host key."
note_zh = "Recovery 从 `recovery_b` 独立于 U-Boot 启动，提供 USB NCM/SSH，主机密钥持久保存。"

[items.first-install]
status = "Works"
note = "`prepare-install` splits the original userdata allocation; installation and the first EFI boot passed."
note_zh = "`prepare-install` 划分原 userdata 空间；安装与首次 EFI 启动均通过。"

[items.reboot-modes]
status = "Works"
note = "Reboot arguments `bootloader` and `recovery` reach OEM fastboot and the stored recovery."
note_zh = "重启参数 `bootloader` 与 `recovery` 可进入 OEM fastboot 和已安装的 recovery。"

[items.internal-storage]
status = "Works"
note = "UFS with MCQ; Android A, super and calibration partitions are preserved."
note_zh = "UFS（MCQ）；Android A、super 与校准分区保持不变。"

[items.removable-storage]
status = "N/A"
note = "The device has no microSD slot."
note_zh = "设备没有 microSD 卡槽。"

[items.display]
status = "Works"
note = "N1 1440×3200 DSC panel at 30/60/120 Hz; a brief noise flash before the Linux console remains."
note_zh = "N1 1440×3200 DSC 面板，支持 30/60/120 Hz；进入 Linux 控制台前仍有短暂花屏闪烁。"
verified = "2026-10-09"

[items.backlight]
status = "Works"
note = "Brightness slider and screen off/on work without corruption after wake."
note_zh = "亮度滑块与熄屏/亮屏可用，唤醒后无花屏。"
verified = "2026-10-09"

[items.touchscreen]
status = "Works"
note = "In-kernel driver for the Android 16 controller firmware; palm rejection and edges are untested."
note_zh = "内核驱动支持 Android 16 控制器固件；防误触与边缘未测试。"
verified = "2026-10-24"

[items.buttons]
status = "Untested"
note = "Power and volume keys enumerate and the power key wakes from suspend; desktop actions are unchecked."
note_zh = "电源与音量键已枚举，电源键可从挂起唤醒；桌面动作未检查。"

[items.external-display]
status = "Works"
note = "A DP monitor shows the desktop; DP audio, other modes and hotplug are untested."
note_zh = "DP 显示器可显示桌面；DP 音频、其他模式与热插拔未测试。"
verified = "2026-10-08"

[items.gpu-gl]
status = "Works"
note = "Adreno 750 through Freedreno renders the desktop; glmark2 validation passed on the former Android 14 base."
note_zh = "Adreno 750 经 Freedreno 渲染桌面；glmark2 校验在原 Android 14 底层上通过。"
verified = "2026-10-24"

[items.gpu-vulkan]
status = "Untested"
note = "vkmark ran through Turnip without faults; on-screen output is not yet verified."
note_zh = "vkmark 经 Turnip 运行无故障；屏幕输出尚未验证。"

[items.video-decode]
status = "Partial"
note = "VA-API over Iris V4L2 played ordinary video on the former Android 14 base; not rechecked on Android 16."
note_zh = "基于 Iris V4L2 的 VA-API 在原 Android 14 底层上可播放普通视频；尚未在 Android 16 上复查。"
verified = "2026-10-08"

[items.speaker]
status = "Partial"
note = "Stereo music played from the speakers on the former Android 14 base; not rechecked on Android 16."
note_zh = "立体声音乐在原 Android 14 底层上可经扬声器播放；尚未在 Android 16 上复查。"
verified = "2026-10-08"

[items.headphones]
status = "N/A"
note = "No 3.5 mm jack."
note_zh = "无 3.5 mm 耳机孔。"
[items.microphone]
status = "Untested"
note = "Microphone capture is unverified."
note_zh = "麦克风录音未验证。"

[items.camera]
status = "Partial"
note = "The four rear cameras capture RAW and processed images at 30 fps through libcamera and PipeWire, one camera at a time; the front camera is not yet enabled. Autofocus, stabilisation and image tuning are not implemented."
note_zh = "四个后置摄像头可通过 libcamera 与 PipeWire 以 30 fps 拍摄 RAW 与处理后的图像（一次一个）；前置摄像头尚未启用。自动对焦、防抖与画质调校尚未实现。"

[items.camera-flash]
status = "Broken"
note = "No flash LED driver is integrated."
note_zh = "尚未集成闪光灯驱动。"

[items.wifi]
status = "Works"
note = "WCN7850 associates on 5 GHz (EHT), gets DHCP and carries traffic; reconnects after resume."
note_zh = "WCN7850 可在 5 GHz（EHT）关联、获取 DHCP 并传输数据；挂起恢复后可重连。"

[items.bluetooth]
status = "Partial"
note = "BR/EDR and LE pairing, L2CAP data and GATT reads work; audio and HID profiles are untested."
note_zh = "BR/EDR 与 LE 配对、L2CAP 数据和 GATT 读取可用；音频与 HID 配置文件未测试。"

[items.usb-network]
status = "Works"
note = "NCM with DHCP and SSH in the system and recovery, at 5 Gbit/s in the system."
note_zh = "系统与 recovery 中 NCM、DHCP 和 SSH 均可用，系统中可达 5 Gbit/s。"

[items.usb-host]
status = "Broken"
note = "USB host mode and data-role swap are not supported yet."
note_zh = "尚不支持 USB 主机模式和数据角色切换。"

[items.mobile-data]
status = "Works"
note = "Experimental opt-in: LTE/5G NR registration with IPv4 and IPv6 data."
note_zh = "实验性可选功能：LTE/5G NR 注册，IPv4 与 IPv6 数据可用。"

[items.calls]
status = "Broken"
note = "No voice (VoLTE/IMS) stack is integrated."
note_zh = "尚未集成语音（VoLTE/IMS）软件栈。"

[items.sms]
status = "Partial"
note = "Sending and receiving worked on the former Android 14 base; not rechecked on Android 16."
note_zh = "收发短信在原 Android 14 底层上可用；尚未在 Android 16 上复查。"

[items.gnss]
status = "Untested"
note = "No location fix has been obtained."
note_zh = "尚未获得定位结果。"

[items.nfc]
status = "Broken"
note = "No NFC driver is integrated."
note_zh = "尚未集成 NFC 驱动。"

[items.battery]
status = "Works"
note = "ADSP battery telemetry is consistent; the charge counter follows discharge in coarse steps."
note_zh = "ADSP 电池遥测一致；电荷计数随放电按较粗步进变化。"

[items.charging]
status = "Partial"
note = "9 V USB PD charging was observed; no full charge cycle, and wireless charging is not supported."
note_zh = "已观察到 9 V USB PD 充电；尚无完整充电周期，且不支持无线充电。"

[items.suspend]
status = "Works"
note = "s2idle standby of over 2 h resumed cleanly at about 28 mA; `deep` is not usable."
note_zh = "s2idle 待机 2 小时以上可正常恢复，约 28 mA；`deep` 不可用。"

[items.shutdown]
status = "Partial"
note = "Reboots now complete reliably; power-off and cold boot are not yet verified."
note_zh = "重启现已可靠完成；关机与冷启动尚未验证。"

[items.cpu-frequency]
status = "Partial"
note = "All four CPU policies reach their top frequencies under load and drop back when idle; performance is not yet benchmarked."
note_zh = "四个 CPU 策略在负载下均达到最高频率，空闲后回落；性能尚未经基准测试。"
[items.thermal]
status = "Partial"
note = "Temperatures are reported; throttling under sustained load is unverified."
note_zh = "可读取温度；持续负载下的降频未验证。"

[items.accelerometer]
status = "Works"
note = "SSC accelerometer drives desktop rotation; rechecked only in software on Android 16."
note_zh = "SSC 加速度计驱动桌面旋转；在 Android 16 上仅做了软件复查。"
verified = "2026-10-07"

[items.magnetometer]
status = "Untested"

[items.ambient-light]
status = "Partial"
note = "The front sensor streams lux to automatic brightness; curve tracking is unverified."
note_zh = "前置传感器向自动亮度提供照度；亮度曲线跟随未验证。"

[items.proximity]
status = "Untested"
note = "Sensor presence is not established."
note_zh = "尚未确认是否有该传感器。"

[items.hall]
status = "Untested"
note = "Sensor presence is not established."
note_zh = "尚未确认是否有该传感器。"

[items.haptics]
status = "Broken"
note = "No vibration motor driver is integrated."
note_zh = "尚未集成振动马达驱动。"

[items.fingerprint]
status = "Broken"
note = "No fingerprint driver is integrated."
note_zh = "尚未集成指纹驱动。"
