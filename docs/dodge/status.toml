[device]
name = "OnePlus 13 (dodge)"
name_zh = "一加 13（dodge）"
soc = "Qualcomm SM8750 (Snapdragon 8 Elite)"
kernel = "Linux 7.3.1 with Dodge patches"
kernel_zh = "Linux 7.3.1 及 Dodge 补丁"
updated = "2026-11-09"

[items.boot-chain]
status = "Works"
note = "Installed slot-B U-Boot boots NixOS through systemd-boot; Android slot A is preserved."
note_zh = "B 槽 U-Boot 经 systemd-boot 启动 NixOS；保留 Android A 槽。"

[items.generations]
status = "Partial"
note = "Generation updates boot normally; manual rollback remains untested."
note_zh = "系统代际更新可正常启动；手动回滚尚未测试。"
[items.ram-recovery]
status = "Works"
note = "Independent host-supplied RAM recovery boots with a populated ESP and provides USB SSH."
note_zh = "独立的主机提供 RAM recovery 可在 ESP 已写入时启动，并提供 USB SSH。"
[items.first-install]
status = "Works"
note = "Recovery prepares root/boot partitions and installs a bootable NixOS closure."
note_zh = "Recovery 可准备根分区和启动分区，并安装可启动的 NixOS 闭包。"
[items.reboot-modes]
status = "Partial"
note = "Reboot to the OEM bootloader works; the recovery reboot action remains untested."
note_zh = "可重启到原厂 bootloader；重启到 recovery 的操作尚未测试。"
[items.internal-storage]
status = "Works"
note = "UFS hosts the installed ext4 root and FAT boot filesystem."
note_zh = "UFS 承载已安装的 ext4 根文件系统和 FAT 启动文件系统。"

[items.removable-storage]
status = "Untested"

[items.display]
status = "Works"
verified = "2026-11-08"

[items.backlight]
status = "Works"
note = "Brightness adjustment and panel off/wake work."
note_zh = "亮度调节及屏幕熄灭/唤醒可用。"
verified = "2026-11-07"
[items.touchscreen]
status = "Works"
note = "Contact release and driver removal ownership are corrected."
note_zh = "已修正触点释放解析和驱动移除时的内存所有权。"
verified = "2026-11-08"

[items.buttons]
status = "Works"
note = "Power and both volume directions work."
note_zh = "电源键及音量加减键可用。"
verified = "2026-11-07"
[items.external-display]
status = "Works"
note = "DASUNG works at native 3200x1800 around 40 Hz; the self-powered display does not charge the phone."
note_zh = "DASUNG 可使用原生 3200x1800、约 40 Hz；显示器独立供电，不为手机充电。"
verified = "2026-11-10"
[items.gpu-gl]
status = "Partial"
note = "The desktop uses Adreno acceleration; a GL benchmark has not been run."
note_zh = "桌面使用 Adreno 加速；尚未运行 GL 基准测试。"
[items.gpu-vulkan]
status = "Partial"
note = "Geekbench 6.7.1 Preview Vulkan compute: 15159 after GPU clock calibration was corrected. Earlier results: [8534 with default settings](https://browser.geekbench.com/v6/compute/6966589) and [8750 with diagnostic shader-IR logging](https://browser.geekbench.com/v6/compute/6966684), both before the correction. Actual compute clock is restored to about 1.1 GHz. Graphical rendering remains unverified."
note_zh = "GPU 时钟校准修正后的 Geekbench 6.7.1 Preview Vulkan 计算成绩为 15159。修正前的成绩：[默认设置 8534](https://browser.geekbench.com/v6/compute/6966589)，[启用诊断着色器 IR 日志 8750](https://browser.geekbench.com/v6/compute/6966684)。实际计算时钟恢复至约 1.1 GHz。图形渲染仍未验证。"
benchmark = "https://browser.geekbench.com/v6/compute/6966777"

[items.video-decode]
status = "Partial"
note = "VA-API hardware decode passes H.264, HEVC, VP9 and AV1 frame comparisons; visual playback remains unverified."
note_zh = "VA-API 硬件解码通过 H.264、HEVC、VP9 和 AV1 逐帧比较；可见播放效果尚未验证。"
[items.speaker]
status = "Works"
note = "Built-in speaker playback works with a fixed hardware volume ceiling."
note_zh = "内置扬声器播放可用，驱动保留固定的硬件音量上限。"
verified = "2026-11-09"

[items.headphones]
status = "Untested"

[items.microphone]
status = "Untested"

[items.camera]
status = "Partial"
note = "Front camera RAW10 capture is available; rear cameras and application preview are not yet supported."
note_zh = "前置相机已支持 RAW10 采集；后置相机和应用预览尚未支持。"

[items.camera-flash]
status = "Untested"

[items.wifi]
status = "Works"

[items.bluetooth]
status = "Works"
note = "Authenticated BLE keyboard/mouse input and A2DP/AVRCP/HFP headset profiles work."
note_zh = "经认证的 BLE 键盘/鼠标输入及 A2DP/AVRCP/HFP 耳机配置可用。"

[items.usb-network]
status = "Works"
note = "USB NCM provides SSH access."
note_zh = "USB NCM 提供 SSH 访问。"

[items.usb-host]
status = "Works"
note = "A phone-powered USB2 hub and keyboard work alongside four-lane DisplayPort; USB3 return and mouse input remain untested."
note_zh = "手机供电的 USB2 集线器和键盘可与四通道 DisplayPort 同时使用；USB3 恢复和鼠标输入尚未测试。"
verified = "2026-11-10"

[items.mobile-data]
status = "Works"
note = "LTE and 5G SA data carry HTTPS traffic."
note_zh = "LTE 和 5G SA 数据可传输 HTTPS 流量。"
[items.calls]
status = "Untested"

[items.sms]
status = "Works"
note = "Incoming and outgoing SMS work through IMS."
note_zh = "可经 IMS 接收和发送短信。"
[items.gnss]
status = "Untested"

[items.nfc]
status = "Untested"

[items.battery]
status = "Partial"
note = "Capacity, voltage and current telemetry are available; discharge behaviour remains untested."
note_zh = "可读取电量、电压和电流；放电行为尚未测试。"
[items.charging]
status = "Partial"
note = "USB charging reports positive battery current below full capacity; a complete charge cycle remains unverified."
note_zh = "电池未满时 USB 充电可报告正向电池电流；完整充电周期仍未验证。"

[items.suspend]
status = "Partial"
note = "Retention-mode s2idle resumes with RTC wake when SS3 is disabled; enabling SS3 system collapse still causes resets. Low-power and long-duration standby are not yet verified."
note_zh = "禁用 SS3 后，保留模式 s2idle 可通过 RTC 唤醒并恢复；启用 SS3 系统断电仍会导致重置。低功耗和长时间待机尚未验证。"

[items.shutdown]
status = "Partial"
note = "Normal reboot works; power-off and subsequent cold boot remain untested."
note_zh = "正常重启可用；关机及之后的冷启动尚未测试。"
[items.cpu-frequency]
status = "Works"
note = "schedutil scales both clusters up to 3.5328 GHz and 4.32 GHz with boost enabled. Geekbench 7.0.0 Preview after CPU capacity and boost corrections: 2505 single-core / 8696 multi-core; [earlier baseline: 1660 / 8992](https://browser.geekbench.com/v7/cpu/831184). [Geekbench 6.7.1 Preview: 2811 single-core / 8822 multi-core](https://browser.geekbench.com/v6/cpu/19447918)."
note_zh = "schedutil 可调节两个簇的频率，启用 boost 后最高为 3.5328 GHz 和 4.32 GHz。CPU 容量和 boost 修正后的 Geekbench 7.0.0 Preview 成绩为单核 2505 / 多核 8696；[先前基线为 1660 / 8992](https://browser.geekbench.com/v7/cpu/831184)。[Geekbench 6.7.1 Preview 成绩为单核 2811 / 多核 8822](https://browser.geekbench.com/v6/cpu/19447918)。"
benchmark = "https://browser.geekbench.com/v7/cpu/832733"
[items.thermal]
status = "Partial"
note = "Temperature sensors report values; sustained thermal throttling remains unverified."
note_zh = "温度传感器可报告读数；持续负载下的热节流尚未验证。"
[items.accelerometer]
